  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(totalW*dpr); cv.height=Math.round(totalH*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0d0f12'; ctx.fillRect(0,0,totalW,totalH);
  // 网格
  const mm=2.5, big=5;
  ctx.lineWidth=0.5;
  for(let x=0;x<=totalW;x+=PX*mm){ ctx.strokeStyle='rgba(190,60,60,.18)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,totalH); ctx.stroke(); }
  for(let y=0;y<=totalH;y+=PX*mm){ ctx.strokeStyle='rgba(190,60,60,.18)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(totalW,y); ctx.stroke(); }
  ctx.lineWidth=0.9;
  for(let x=0;x<=totalW;x+=PX*big){ ctx.strokeStyle='rgba(215,80,80,.42)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,totalH); ctx.stroke(); }
  for(let y=0;y<=totalH;y+=PX*big){ ctx.strokeStyle='rgba(215,80,80,.42)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(totalW,y); ctx.stroke(); }
  const gain=S.view.gain, pxPerMv=PX*gain;
  const rowH=33*PX, top0=8*PX, gap=6*PX;
  const colW=62.5*PX, x0=12*PX;
  // 3×4
  L12.forEach((row,r)=>{
    const yb=top0+r*(rowH+gap)+rowH*0.62;
    row.forEach((nm,c)=>{
      const buf=ecgBuf[LI[nm]];
      const t1=S.t, t0=t1-colSec;
      ctx.strokeStyle=LEADS[LI[nm]].c; ctx.lineWidth=1.25; ctx.shadowBlur=0;
      ctx.beginPath(); let first=true;
      const li=LI[nm];
      for(let x=0;x<=colW;x++){
        const t=t0+(x/colW)*colSec;
        const ii=Math.round(t*FS);
        const v=samp(buf,t)+drawWander(ii,li)+drawNoise(ii,li)+drawLeadOff(ii,li);
        const yy=yb-clamp(v,-2.2,2.2)*pxPerMv;
        if(first){ctx.moveTo(x0+c*colW+x,yy);first=false;} else ctx.lineTo(x0+c*colW+x,yy);
      }
      ctx.stroke();
      ctx.fillStyle=LEADS[LI[nm]].c; ctx.font='600 '+(3.4*PX)+'px sans-serif'; ctx.textAlign='left';
      ctx.fillText(nm,x0+c*colW+2*PX,yb-rowH*0.5);
      // 定标
      ctx.strokeStyle=LEADS[LI[nm]].c; ctx.beginPath();
      const bx=x0+c*colW, by=yb+rowH*0.2;
      ctx.moveTo(bx,by);ctx.lineTo(bx,by-pxPerMv);ctx.lineTo(bx+2*PX,by-pxPerMv);ctx.lineTo(bx+2*PX,by);ctx.stroke();
    });
  });
  // 底部 II 导联长条
  const yb4=top0+3*(rowH+gap)+rowH*0.62;
  const w4=250*PX, sec4=w4/PX/S.view.speed*25;
  ctx.strokeStyle='#39ff88'; ctx.lineWidth=1.3; ctx.beginPath(); let f2=true;
  for(let x=0;x<=w4;x++){ const v=samp(ecgBuf[LI['II']],S.t-sec4+x/PX/S.view.speed*25);
    const yy=yb4-clamp(v,-2.2,2.2)*pxPerMv; if(f2){ctx.moveTo(x0+x,yy);f2=false;}else ctx.lineTo(x0+x,yy); }
  ctx.stroke();
  ctx.fillStyle='#39ff88'; ctx.font='600 '+(3.4*PX)+'px sans-serif';
  ctx.fillText('II',x0+2*PX,yb4-rowH*0.5);
  // 页脚
  ctx.fillStyle='#5a6673'; ctx.font=(3.0*PX)+'px monospace'; ctx.textAlign='left';
  ctx.fillText(S.view.speed+' mm/s   '+gain+' mm/mV   1mV '+new Date().toLocaleTimeString('zh-CN',{hour12:false}),x0,totalH-3*PX);
  ctx.textAlign='right'; ctx.fillStyle='#3d4a58';
  ctx.fillText('SIMULATED — 非真实患者数据',totalW-x0,totalH-3*PX); ctx.textAlign='left';
  measure12();
}
function measure12(){
  const el=document.getElementById('meas12');
  const buf=ecgBuf[LI['II']];
  // 心率
  let hr=null; if(S.rrHist.length>=3){ const a=[...S.rrHist].sort((x,y)=>x-y); hr=Math.round(60/a[Math.floor(a.length/2)]); }
  if(!hr&&S.hr>0)hr=Math.round(S.hr);
  // 电轴:取最近一个心搏的净 QRS 面积(I / aVF)
  const tR=S.rPeak||(S.t-0.4);
  const win0=tR-0.12, win1=tR+0.16;
  let aI=0,aVF=0,aII=0;
  for(let i=Math.floor(win0*FS);i<=Math.floor(win1*FS);i++){
    aI+=sampIdx(ecgBuf[LI['I']],i); aII+=sampIdx(ecgBuf[LI['II']],i); aVF+=sampIdx(ecgBuf[LI['aVF']],i);
  }
  let axis=Math.round(Math.atan2(aVF,aI)/DEG); if(axis<0)axis+=360;
  if(axis>180)axis-=360;
  // QRS 宽度 / PR / QT:由 II 导联实测
  let qrs=0,pr=0,qt=0;
  const gate=(v)=>Math.abs(v)>0.045;
  let l=Math.floor((tR-0.25)*FS),r=Math.floor((tR+0.30)*FS);
  let peak=0,peakI=l;
  for(let i=l;i<=Math.floor((tR+0.12)*FS);i++){ const v=sampIdx(buf,i); if(v>peak){peak=v;peakI=i;} }
  let a=peakI; while(a>l&&gate(sampIdx(buf,a-1)))a--;
  let b=peakI; while(b<Math.floor((tR+0.25)*FS)&&gate(sampIdx(buf,b+1)))b++;
  qrs=(b-a)/FS;
  // PR:P 波结束到 QRS
  let pw0=Math.floor((tR-0.34)*FS);
  for(let i=pw0;i<a;i++) if(gate(sampIdx(buf,i))){ pr=Math.max(pr,(a-i)/FS); break; }
  if(qrs<0.02){ qrs=S.qrsInt; pr=S.prInt; }
  // QT
  let e=b; while(e<Math.floor((tR+0.55)*FS)&&Math.abs(sampIdx(buf,e))>0.028)e++;
  qt=(e-peakI)/FS; if(qt<0.15)qt=S.qtInt;
  const rrq=hr?60/hr:0.8;
  const qtc=qt/Math.sqrt(Math.max(0.2,rrq/1));
  // 判读
  const notes=[];
  if(hr){ if(hr<60)notes.push(['心动过缓',1]); if(hr>100)notes.push(['心动过速',1]); }
  if(qrs>0.12)notes.push(['QRS 增宽 ('+(qrs*1000).toFixed(0)+' ms) — 束支阻滞/室性起源/预激',1]);
  if(pr>0.20)notes.push(['PR 延长 ('+(pr*1000).toFixed(0)+' ms)',1]);
  if(qtc>0.45)notes.push(['QTc 延长',1]);
  if(S.land.ant>0.1)notes.push(['V1–V4 ST 段抬高 — 前壁梗死可能',2]);
  if(S.land.inf>0.1)notes.push(['Ⅱ/Ⅲ/aVF ST 段抬高 — 下壁梗死可能',2]);
  if(S.land.lat>0.1)notes.push(['Ⅰ/aVL/V5/V6 ST 段改变',1]);
  if(S.land.lvh>0.2)notes.push(['电压增高,R/R′ 增高 — 左室肥厚可能',0]);
  const rh=RHY[S.rhythmForce||S.rhythm];
  el.innerHTML=
   '<div><span>心率</span><b>'+(hr||'--')+'</b><span>bpm &nbsp;·&nbsp; 律:'+rh.n+'</span></div>'+
   '<div><span>电轴</span><b>'+axis+'°</b><span>&nbsp;·&nbsp; Ⅱ 导联振幅 '+(aII/FS).toFixed(2)+' mV·s</span></div>'+
   '<div><span>PR</span><b>'+(pr*1000).toFixed(0)+'</b><span>ms &nbsp;·&nbsp; QRS <b>'+(qrs*1000).toFixed(0)+'</b> ms</span></div>'+
   '<div><span>QT/QTc</span><b>'+(qt*1000).toFixed(0)+'/'+(qtc*1000).toFixed(0)+'</b><span>ms (Bazett)</span></div>'+
   '<div><span>HRV</span><b>SDNN '+S.hrv.sdnn.toFixed(0)+' / RMSSD '+S.hrv.rmssd.toFixed(0)+'</b><span> ms · RR '+S.hrv.rr+' ms</span></div>'+
   '<div><span>危险</span><b style="color:'+(S.tdpRisk>0.5?'#ff3b30':(S.tdpRisk>0.25?'#ffd23f':'#39ff88'))+'">尖端扭转风险 '+Math.round(S.tdpRisk*100)+'%</b><span> · K⁺ '+S.elec.K.toFixed(1)+' Mg²⁺ '+S.elec.Mg.toFixed(1)+' · 体温 '+S.temp.toFixed(1)+'℃</span></div>'+
   '<div><span>SpO₂</span><b>'+S.sao2.toFixed(1)+'%</b><span>&nbsp;·&nbsp; PaO₂ '+Math.round(S.pao2)+' &nbsp; PaCO₂ '+Math.round(S.paco2)+
   ' &nbsp; 乳酸 '+S.lactate.toFixed(1)+' mmol/L</span></div>'+
   '<div><span>血流</span><b>CO '+(S.co||0).toFixed(2)+'</b><span>L/min &nbsp;·&nbsp; SV '+Math.round(S.sv||0)+' mL &nbsp; SVR '+Math.round(S.svr)+' &nbsp; DO₂/VO₂ '+(S.dox||0).toFixed(2)+'</span></div>'+
   (notes.length?'<hr class="sep"><div style="color:#6b7d8e">自动判读</div>'+notes.map(n=>
     '<div style="color:'+(n[1]===2?'#ff5b5b':n[1]===1?'#ffd23f':'#8fb0c8')+';margin-top:3px">• '+n[0]+'</div>').join(''):'')+
   '<hr class="sep"><div class="note">本页由实时向量环信号按标准 3×4 排布渲染(Ⅰ/aVR/V1/V4;Ⅱ/aVL/V2/V5;Ⅲ/aVF/V3/V6)+ Ⅱ 导联长节律条。'+
   '波形为数值仿真,非真实患者数据。</div>';
}

function ctlSlider(p,label,get,set,min,max,step,fmt){
  const r=h('div','rowi');
  r.appendChild(h('div','lb',label));
  const i=h('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=get();

function ctlSwitch(p,label,get,set){
  const r=h('div','rowi'); r.appendChild(h('div','lb',label));

}
function ctlSelect(p,label,opts,get,set){
  const r=h('div','rowi'); r.appendChild(h('div','lb',label));

  s.onchange=()=>set(s.value); r.appendChild(s); p.appendChild(r); return r;

/* ---------- NIBP ---------- */
function openNibp(){
  openSheet('无创血压 (振荡法)',(b)=>{
    const N=S.nibp;
    const g=grp(b,'袖带');
    const stat=h('div','note');
    stat.innerHTML='状态:'+({idle:'待机',inflate:'加压中',deflate:'放气测量中'}[N.st])+
      ' &nbsp;·&nbsp; 袖带压 <b style="color:#ff5b5b;font-size:17px">'+Math.round(N.cuff)+'</b> mmHg'+
      (N.st!=='idle'?' <span style="color:#ffd23f">'+Math.round((N.st==='inflate'?N.inflate:N.deflate))+' mmHg/s</span>':'');
    g.appendChild(stat);
    const chart=document.createElement('canvas'); chart.width=700; chart.height=200;
    chart.style.cssText='width:100%;height:110px;margin-top:10px;background:#080c11;border:1px solid #1c2733;border-radius:6px';
    g.appendChild(chart);
    const drawC=()=>{ if(!document.getElementById('sheet').classList.contains('on'))return;
      const cx=chart.getContext('2d'); cx.clearRect(0,0,700,200);
      if(!N.hist.length)return; const hi=Math.max(180,N.cuff);
      cx.strokeStyle='#ff5b5b'; cx.lineWidth=1.6; cx.beginPath();
      N.hist.forEach((p,i)=>{ const x=i/N.hist.length*700, y=200-(p.cuff/hi)*195;
        i?cx.lineTo(x,y):cx.moveTo(x,y); }); cx.stroke();
      cx.strokeStyle='#39d7f2'; cx.lineWidth=1.2; cx.beginPath();
      N.hist.forEach((p,i)=>{ const x=i/N.hist.length*700, y=200-(p.amp/(N.peak||0.15))*70-5;
        i?cx.lineTo(x,y):cx.moveTo(x,y); }); cx.stroke();
      cx.fillStyle='#5a6673'; cx.font='11px monospace'; cx.fillText('袖带压 0–'+hi+' mmHg(红) / 振荡幅度(青)',6,14);
      requestAnimationFrame(drawC); };
    setTimeout(drawC,200);

/* 从环形缓冲取一段时间的某导联(返回 mV) */
function grabLead(name,sec){
  const L2=LI[name], out=[];
  const t1=S.t-0.05, t0=t1-sec;
  for(let i=Math.floor(t0*FS);i<=Math.floor(t1*FS);i++){
    const gi=((i%BUFSZ)+BUFSZ)%BUFSZ;
    out.push([i/FS, ecgBuf[L2][gi]]);
  }
  return out;
}
/* 画一张标准心电图纸 */
function buildECGCanvas(kind,sec,leads){
  const PX=4;                       // 4 px / mm
  const SEC=2.5, COLW=62.5;          // 每列 2.5 秒 = 62.5 mm
  const nCol=Math.max(1,Math.round(sec/SEC));
  const M=14, HEAD=26, FOOT=34, ROWH=34;
  const PAPER={bg:'#fdfcf7',grid1:'rgba(205,85,85,.30)',grid2:'rgba(190,60,60,.62)',ink:'#16181a',lab:'#2a2d31'};
  let W,H,leadRows,colW=COLW*PX,blockRows=1,colsPerRow=nCol;
  if(kind==='12'){
    const rowH=ROWH*PX/4 * (S.exp.rowGap||1);
    W=M*2+4*colW;
    H=Math.round(M+HEAD+3*rowH+rowH+FOOT+M);  // 3 行 12 导联 + 1 行 II 长条
  }else{
    const perRow=8;
    blockRows=Math.ceil(nCol/perRow);
    colsPerRow=Math.min(nCol,perRow);
    const rowH=ROWH*PX/4*(S.exp.rowGap||1);
    W=M*2+colsPerRow*colW;
    H=Math.round(M+HEAD+blockRows*leads.length*rowH+FOOT+M);
  }
  const cv=document.createElement('canvas');
  const dpr=2;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAPER.bg; ctx.fillRect(0,0,W,H);
  if(S.exp.grid){
    ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=PX){ ctx.strokeStyle=PAPER.grid1; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=PX){ ctx.strokeStyle=PAPER.grid1; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.lineWidth=0.9;
    for(let x=0;x<W;x+=PX*5){ ctx.strokeStyle=PAPER.grid2; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=PX*5){ ctx.strokeStyle=PAPER.grid2; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }
  if(S.exp.title||S.exp.patient){
    ctx.fillStyle=PAPER.ink; ctx.textAlign='left';
    if(S.exp.title) { ctx.font='bold '+(4.2*PX)+'px sans-serif'; ctx.fillText('ICU 生理监护模拟器 · 心电图',M,HEAD*0.62); }
    if(S.exp.patient){ ctx.font=(2.6*PX)+'px sans-serif'; ctx.textAlign='right';
      ctx.fillText((S.sex==='M'?'男':'女')+' · '+S.age+' 岁 · '+S.weight+' kg · Hb '+S.hb+' g/L    '+
        new Date().toLocaleString('zh-CN',{hour12:false}),W-M,HEAD*0.62); }
    ctx.textAlign='left';
  }
  const gain=S.view.gain, pxPerMv=gain*PX;
  // 实际绘制
  const plot=(pts,t0,t1,x0,y0,w,baseY,pxPerMv)=>{
    ctx.strokeStyle=PAPER.ink; ctx.lineWidth=1.15; ctx.lineJoin='round'; ctx.beginPath();
    let first=true;
    for(let i=0;i<pts.length;i++){
      const t=pts[i][0], v=pts[i][1];
      const x=x0+(t-t0)/(t1-t0)*w;
      const y=baseY-clamp(v,-3.5,3.5)*pxPerMv;
      if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);
    }
    ctx.stroke();
  };
  const calPulse=(x0,y0,h,label)=>{
    ctx.strokeStyle=PAPER.ink; ctx.lineWidth=1.15;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0,y0-h); ctx.lineTo(x0+2*PX,y0-h); ctx.lineTo(x0+2*PX,y0); ctx.stroke();
  };
  if(kind==='12'){
    const rowH=ROWH*PX/4*(S.exp.rowGap||1), t1=S.t-0.05, t0=t1-10;
    for(let r=0;r<3;r++){
      const baseY=M+HEAD+r*rowH+rowH*0.72;
      for(let c=0;c<4;c++){
        const nm=L12[r][c], x0=M+c*colW;
        const pts=grabLead(nm,10);
        const seg=pts.filter(p=>p[0]>=t0+c*2.5&&p[0]<t0+(c+1)*2.5);
        if(seg.length>1) plot(seg,t0+c*2.5,t0+(c+1)*2.5,x0,baseY,colW,baseY,pxPerMv);
        if(S.exp.label){ ctx.fillStyle=PAPER.lab; ctx.font='bold '+(2.9*PX)+'px sans-serif'; ctx.textAlign='left'; ctx.fillText(nm,x0+1.5*PX,baseY-rowH*0.55); }
        if(S.exp.cal) calPulse(x0+1*PX,baseY+rowH*0.22,pxPerMv);
      }
    }
    // 底部 II 导联长条
    const baseY=M+HEAD+3*rowH+rowH*0.72;
    const pts=grabLead('II',10);
    plot(pts,t0,t1,M,baseY,nCol*colW,baseY,pxPerMv);
    if(S.exp.label){ ctx.fillStyle=PAPER.lab; ctx.font='bold '+(2.9*PX)+'px sans-serif'; ctx.fillText('II',M+1.5*PX,baseY-rowH*0.55); }
    // 页脚:测量值
    const hr=(S.rrHist.length?Math.round(60/([...S.rrHist].sort((a,b)=>a-b)[Math.floor(S.rrHist.length/2)]||0.8)):Math.round(S.hr));
    ctx.fillStyle=PAPER.lab; ctx.font=(2.7*PX)+'px monospace';
    if(S.exp.measures){
      ctx.fillText('心率 '+hr+' bpm   QT '+Math.round(S.qtInt*1000)+' ms   QTc '+Math.round(S.qtc*1000)+' ms   '+
        'QRS '+Math.round(S.qrsInt*1000)+' ms   血氧 '+S.sao2.toFixed(1)+'%   pH '+S.ph.toFixed(2)+'   乳酸 '+S.lactate.toFixed(1)+' mmol/L',M,H-M-14*PX);
    }
    if(S.exp.meta){
      ctx.fillText('25 mm/s   '+gain+' mm/mV   1 mV 定标   '+rhyName()+'   '+new Date().toLocaleString('zh-CN',{hour12:false}),
        M,H-M-5*PX);
    }
  }else{
    const rowH=ROWH*PX/4*(S.exp.rowGap||1), t1=S.t-0.05, t0=t1-sec;
    leads.forEach((nm,r)=>{
      const pts=grabLead(nm,sec);
      for(let b=0;b<blockRows;b++){
        const baseY=M+HEAD+(b*leads.length+r)*rowH+rowH*0.70;
        for(let c=0;c<colsPerRow;c++){
          const ci=b*colsPerRow+c; if(ci>=nCol) break;
          const cs=t0+ci*SEC, ce=cs+SEC;
          const seg=pts.filter(p=>p[0]>=cs&&p[0]<=ce);
          if(seg.length>1) plot(seg,cs,ce,M+c*colW,baseY,colW,baseY,pxPerMv);
          ctx.strokeStyle=PAPER.grid2; ctx.lineWidth=0.8;
          ctx.beginPath(); ctx.moveTo(M+(c+1)*colW,M+HEAD-4); ctx.lineTo(M+(c+1)*colW,H-M-4*PX); ctx.stroke();
        }
        if(S.exp.label){ ctx.fillStyle=PAPER.lab; ctx.font='bold '+(2.9*PX)+'px sans-serif'; ctx.textAlign='left'; ctx.fillText(nm+(blockRows>1?'  ('+(b+1)+'/'+blockRows+')':''),M+1.5*PX,baseY-rowH*0.52); }
        if(S.exp.cal) calPulse(M+colW-6*PX,baseY+rowH*0.22,pxPerMv);
      }
    });
    ctx.fillStyle=PAPER.lab; ctx.font=(2.7*PX)+'px monospace'; ctx.textAlign='left';
    if(S.exp.measures||S.exp.meta){
      const p1=(S.exp.measures?'心率 '+Math.round(S.hr)+' bpm    QTc '+Math.round(S.qtc*1000)+' ms    '+rhyName()+'    ':'');
      const p2=(S.exp.meta?'25 mm/s   '+gain+' mm/mV    '+new Date().toLocaleString('zh-CN',{hour12:false}):'');
      ctx.fillText((p1+p2).trim(),M,H-M-8*PX);
    }
  }
  return cv;
}
function doExport(kind){
  const sec=parseInt(S.exp.sec)||10, leads=S.exp.leads.slice();
  if(kind==='csv'){ exportCSV(leads,sec); return; }
  const cv=buildECGCanvas(S.exp.mode==='12'?'12':'strip', S.exp.mode==='12'?10:sec, leads);
  cv.toBlob(function(blob){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ECG_'+(S.exp.mode==='12'?'12lead':'strip')+'_'+(S.exp.mode==='12'?10:sec)+'s_'+Date.now()+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    log('📤 导出心电图 '+(S.exp.mode==='12'?'12 导联报告':leads.join('/')+' '+sec+' 秒'));

function exportCSV(leads,sec){
  const t1=S.t-0.05, t0=t1-sec;
  const i0=Math.floor(t0*FS), i1=Math.floor(t1*FS);
  let csv='time_s'+leads.map(l=>','+l+'_mV').join('')+'\n';
  for(let i=i0;i<=i1;i++){
    const gi=((i%BUFSZ)+BUFSZ)%BUFSZ;
    let row=((i/FS)-t0).toFixed(4);
    leads.forEach(l=>{ row+=','+ecgBuf[LI[l]][gi].toFixed(4); });
    csv+=row+'\n';
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ECG_'+leads.join('-')+'_'+sec+'s.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  log('📤 导出 CSV '+leads.join('/')+' '+sec+' 秒');
  toast('已导出 CSV');
}

/* 触摸:左滑开菜单 / 右滑关 */
(function(){
  let x0=0,y0=0,act=false,open=false;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; act=true;
    open=document.getElementById('drawer').classList.contains('on');
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!act)return; act=false;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<45||Math.abs(dy)>60)return;
    const inSheet=document.getElementById('sheet').classList.contains('on');
    if(dx<-45&&x0<70){ if(!inSheet)openDrawer(); }
    else if(dx>45&&open){ closeDrawer(); }
  },{passive:true});
  document.addEventListener('touchmove',()=>{ audioInit(); },{once:true,passive:true});
})();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeSheet(); closeDrawer(); document.getElementById('pg12').classList.remove('on'); }
  if(e.key===' '){ e.preventDefault(); S.silenced=!S.silenced; if(S.silenced)S.silenceUntil=Date.now()+120000; }
  if(e.key.toLowerCase()==='d'&&!S.defib.st.match(/ready|fired/)) defibShock();
  if(e.key.toLowerCase()==='c') defibCharge();
  if(e.key.toLowerCase()==='n'){ const N=S.nibp; if(N.st==='idle'){N.st='inflate';N.cuff=0;N.peak=0;N.sbpx=0;N.dbpx=0;N.hist=[];S.cuff=0;} }
});
let resizeT=null;
window.addEventListener('resize',()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{
  document.querySelectorAll('#waveWrap canvas').forEach(fitCanvas);
  if(document.getElementById('pg12').classList.contains('on'))draw12();
},160); });

let acc=0,lastT=performance.now(),uiAcc=0,alarmAcc=0;
function frame(now){
  const dtR=Math.min(.08,(now-lastT)/1000); lastT=now;
  const dt=dtR*S.timeScale;
  acc+=dt;
  const step=1/FS; let guard=0;
  while(acc>=step&&guard++<400){ acc-=step; physStep(step); }
  // 波形参数变化 → 按心搏描述符重建可见段(改动立刻全局生效,且不留旧数据)
  if(S.sigDirty&&(S.t-S.sigDirtyAt)>0.08) renderBuf(13);
  // 12导联页
  if(document.getElementById('pg12').classList.contains('on')){ uiAcc+=dtR; if(uiAcc>0.5){uiAcc=0;draw12();} }
  // 报警音频
  alarmAcc+=dtR;
  if(alarmAcc>1.1){
    alarmAcc=0;
    const A=(S.activeAlarms||[]);
    const hp=A.find(a=>a.hp===2);
    if(hp&&!(S.silenced&&Date.now()<S.silenceUntil)){ beep(1180,.28,.06); setTimeout(()=>beep(880,.28,.06),300); }
    else if(A.length&&!(S.silenced&&Date.now()<S.silenceUntil)) beep(760,.1,.035);
  }
  // 充电音渐强
  if(S.defib.st==='charging'&&toneO&&AC) toneO.frequency.value=140+(S.defib.e/360)*420+S.defib.ch*90;
  // 电池
  S.defib.batt=Math.max(0,S.defib.batt-dt*0.008);
  sweepAdvance(dtR);
  drawAll();
  // 时钟
  const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});
  document.getElementById('batt').textContent='⚡'+S.defib.batt.toFixed(0)+'%';
  document.getElementById('ptMeta').textContent=(S.sex==='M'?'男 ':'女 ')+S.age+'y · '+S.weight+'kg · Hb '+S.hb
    +' · FiO₂ '+(S.fio2*100).toFixed(0)+'% · GCS '+(S.gcs||15)
    +(S.prog.on&&S.prog.next<S.t+1e9?(' · 病程 '+Math.max(0,S.prog.next-S.t).toFixed(0)+'s'):'');
  requestAnimationFrame(frame);
}
/* ---------- 启动 ---------- */
(function init(){
  S.nextBeat=0.1;
  buildTiles(); buildRows(); renderDrawer();
  log('监护仪启动 — 模拟开始');
  const el=document.getElementById('ptName');

  setTimeout(draw12,400);
  requestAnimationFrame(frame);
})();

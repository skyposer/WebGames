<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>ICU 生理监护模拟器</title>
<style>
:root{
  --bg:#05070a; --bg2:#0a0e14; --panel:#0d131b; --line:#1c2733;
  --ink:#c8d6e2; --dim:#6b7d8e; --dimmer:#3d4a58;
  --ecg:#39ff88; --spo2:#39d7f2; --abp:#ff5b5b; --resp:#ffd23f; --temp:#f2f5f7; --co2:#b98cff;
  --ok:#39ff88; --warn:#ffd23f; --crit:#ff3b30;
  --fs:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.topbar .mb{width:34px;height:30px;border:1px solid var(--line);background:#111821;color:var(--ink);border-radius:6px;font-size:16px;flex:0 0 auto}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:12.5px;font-weight:600;color:#dce8f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{display:block;font-size:10.5px;color:var(--dim)}
.tb{font-size:10.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.tb b{color:var(--ink);font-weight:600;font-size:11.5px}

.alarmbar{flex:0 0 auto;margin:0;padding:5px 10px;font-size:11.5px;font-weight:700;letter-spacing:.4px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;overflow-x:auto}
.alarmbar.hide{display:none}
.a-hp{background:repeating-linear-gradient(45deg,#ff3b30,#ff3b30 12px,#c2140b 12px,#c2140b 24px);color:#fff;animation:pulse .55s infinite alternate}
.a-mp{background:#ffd23f;color:#1a1400}
.a-lp{background:#39d7f2;color:#00191f}
.a-info{background:#1c2733;color:var(--ink)}
@keyframes pulse{from{filter:brightness(.72)}to{filter:brightness(1.25)}}
.alarmbar .tsc{margin-left:auto;opacity:.85;font-weight:500}

.tiles{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tile{background:var(--bg2);padding:4px 6px 5px;min-width:0;position:relative}
.tile .k{font-size:9.5px;letter-spacing:.6px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.tile .v{font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;
  font-family:"DIN Alternate","SF Mono",Menlo,Consolas,monospace;letter-spacing:-.5px}
.tile.small .v{font-size:20px;letter-spacing:-.6px}
.tile .u{font-size:9.5px;color:var(--dim);margin-left:2px;font-weight:500}
.tile .sub{font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.lv0 .v{text-shadow:0 0 10px currentColor}
.t-hr{color:var(--ecg)} .t-sp{color:var(--spo2)} .t-bp{color:var(--abp)} .t-rr{color:var(--resp)} .t-tp{color:var(--temp)} .t-co2{color:var(--co2)}
.tile.alarmL{box-shadow:inset 0 0 0 2px var(--warn);animation:pulse .8s infinite alternate}
.tile.alarmH{box-shadow:inset 0 0 0 2px var(--crit);animation:pulse .45s infinite alternate}
.tile.off{opacity:.4}
.spark{position:absolute;right:4px;bottom:3px;width:52px;height:16px;opacity:.85;pointer-events:none}

.wavewrap{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:
    repeating-linear-gradient(90deg,transparent 0 19px,rgba(60,90,80,.13) 19px 20px),
    repeating-linear-gradient(0deg,transparent 0 19px,rgba(60,90,80,.13) 19px 20px),
    repeating-linear-gradient(90deg,transparent 0 99px,rgba(80,140,120,.3) 99px 100px),
    repeating-linear-gradient(0deg,transparent 0 99px,rgba(80,140,120,.22) 99px 100px),
    var(--bg);
  grid-row:0;grid-column:0}
.row{position:relative;height:var(--rh,74px);border-bottom:1px solid rgba(40,60,72,.5);background:rgba(5,7,10,.55)}
.row canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.row .lb{position:absolute;left:4px;top:2px;font-size:10.5px;font-weight:700;letter-spacing:.4px;z-index:2;text-shadow:0 0 6px #000,0 0 3px #000}
.row .rt{position:absolute;right:4px;top:2px;font-size:10px;color:var(--dim);z-index:2;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
.row .cal{position:absolute;left:4px;bottom:2px;height:10px;z-index:2;opacity:.85}
.row .cal i{display:block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:0;border-style:solid;position:relative}
.row.hide{display:none}

.quickbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.quickbar button{background:var(--bg2);border:0;color:var(--ink);padding:9px 2px 8px;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
.quickbar button i{font-style:normal;font-size:17px;line-height:1}
.quickbar button:active{background:#1a2530}
.quickbar button.hot{color:var(--crit)}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:78vw;max-width:300px;background:var(--panel);
  border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#drawer.on{transform:translateX(0)}
#drawer .dh{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
#drawer .dh b{font-size:15px;display:block}
#drawer .dh span{font-size:10.5px;color:var(--dim)}
#drawer nav{flex:1;overflow-y:auto;padding:6px 0}
#drawer .it{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid rgba(28,39,51,.6);font-size:13.5px;cursor:pointer}
#drawer .it:active{background:#16202b}
#drawer .it i{font-style:normal;font-size:17px;width:22px;text-align:center}
#drawer .it .sub{margin-left:auto;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
#drawer .it.on{background:#16202b;box-shadow:inset 3px 0 0 var(--ecg)}

.sheet{position:fixed;left:0;right:0;bottom:0;top:6vh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;transform:translateY(101%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  z-index:60;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .sh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet .sh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;
  border-radius:2px;background:var(--dimmer)}
.sheet .sh b{flex:1;font-size:15px}
.sheet .sh button{background:#1a2530;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:12px}
.sheet .sb{flex:1;overflow-y:auto;padding:10px 14px 28px;-webkit-overflow-scrolling:touch}

.grp{margin-bottom:16px}
.grp>h4{font-size:11px;letter-spacing:1px;color:var(--dim);margin:0 0 8px;font-weight:600;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.rowi{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12.5px;border-bottom:1px solid rgba(28,39,51,.45)}
.rowi .lb{flex:0 0 auto;min-width:88px;color:var(--dim);font-size:11.5px}
.rowi .val{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-size:11.5px;min-width:52px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ecg);margin-top:-8.5px;box-shadow:0 0 8px rgba(57,255,136,.5)}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--ecg)}
select,input[type=number],input[type=text]{background:#111821;border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:7px 8px;font-size:12.5px;font-family:inherit;flex:1;min-width:0}
.sw{width:44px;height:25px;border-radius:13px;background:#1a2530;border:1px solid var(--line);position:relative;flex:0 0 auto;cursor:pointer;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:.15s}
.sw.on{background:rgba(57,255,136,.22);border-color:var(--ecg)}
.sw.on::after{left:21px;background:var(--ecg)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#111821;color:var(--dim);border-radius:16px;padding:6px 12px;font-size:11.5px;cursor:pointer}
.chip.on{background:rgba(57,255,136,.16);border-color:var(--ecg);color:var(--ecg)}
.chip.danger.on{background:rgba(255,59,48,.18);border-color:var(--crit);color:#ff8078}
.btn{background:#16202b;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;font-size:12.5px;cursor:pointer;text-align:center;font-family:inherit}
.btn:active{background:#1e2a36}
.btn.pri{background:rgba(57,255,136,.14);border-color:var(--ecg);color:var(--ecg)}
.btn.danger{background:rgba(255,59,48,.16);border-color:var(--crit);color:#ff8078}
.btn.big{font-size:16px;font-weight:700;padding:16px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.dcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#111821}
.dcard .t{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dcard .t b{font-size:13.5px;color:#e2ecf4}
.dcard .t em{font-style:normal;font-size:9.5px;color:var(--dim);margin-left:auto;text-align:right}
.dcard .d{font-size:11px;color:var(--dim);margin-bottom:8px;line-height:1.45}
.dcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.dcard .acts button{flex:1;min-width:62px;background:#16202b;border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:8px 4px;font-size:11.5px;cursor:pointer;font-family:inherit}
.dcard .acts button:active{background:var(--ecg);color:#000}
.dcard .cls{font-size:9px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
.dcard .cls.v{color:#ff8078;border-color:#7a2b26}
.dcard .cls.a{color:var(--spo2);border-color:#1c5a66}
.dcard .cls.n{color:#8fb0c8}

.defibwrap{text-align:center}
.bigJ{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  font-family:"DIN Alternate","SF Mono",Menlo,monospace;color:var(--abp);text-shadow:0 0 24px rgba(255,91,91,.45)}
.bigJ span{font-size:18px;color:var(--dim)}
.capbar{height:14px;border:1px solid var(--line);border-radius:7px;background:#0a1017;margin:14px 0;overflow:hidden;position:relative}
.capbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1a5f2a,var(--ecg));transition:width .1s linear}
.capbar.full i{background:linear-gradient(90deg,#5a1a1a,var(--crit))}
.syl{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0}

.logbox{max-height:220px;overflow-y:auto;background:#080c11;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:10.5px;line-height:1.6;font-variant-numeric:tabular-nums}
.logbox div{border-bottom:1px solid rgba(28,39,51,.5);padding:2px 0}
.logbox time{color:var(--dim);margin-right:6px}

.pg12{position:fixed;inset:0;background:#0b0d10;z-index:70;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pg12.on{display:flex}
.pg12 .ph{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.pg12 .ph b{flex:1;font-size:14px}
.pg12 .pb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.pg12 canvas{width:100%;display:block;background:#0d0f12;border:1px solid #22262c;border-radius:4px}
.meas{margin-top:10px;background:#11151a;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;line-height:1.75}
.meas b{color:var(--ecg)}
.meas .warn{color:var(--warn)}
.meas .critx{color:var(--crit)}
.meas div{display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(13,19,27,.97);
  border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-size:12px;z-index:99;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.kbd{font-size:10px;background:#1a2530;border-radius:4px;padding:1px 5px;border:1px solid var(--line);margin-left:4px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.note{font-size:10.5px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="mb" id="menuBtn">☰</button>
    <div class="pt"><b id="ptName">BED 01 · 张××</b><span id="ptMeta">男 68y 70kg</span></div>
    <div class="tb"><b id="clock">--:--</b><br><span id="batt">⚡100%</span></div>
  </header>
  <div id="alarmBar" class="alarmbar hide"></div>
  <div class="tiles" id="tiles"></div>
  <div class="wavewrap" id="waveWrap"></div>
  <nav class="quickbar">
    <button data-act="defib"><i>⚡</i>除颤</button>
    <button data-act="drug"><i>💊</i>给药</button>
    <button data-act="nibp"><i>🩺</i>测压</button>
    <button data-act="cpr"><i>👐</i>CPR</button>
    <button data-act="lead12"><i>📈</i>12导联</button>
  </nav>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dh"><b>监护仪</b><span>左滑菜单 · v2.0 生理模型</span></div>
  <nav id="drawerNav"></nav>
</aside>

<div class="sheet" id="sheet">
  <div class="sh"><b id="sheetTitle">标题</b><button id="sheetClose">关闭</button></div>
  <div class="sb" id="sheetBody"></div>
</div>

<div class="pg12" id="pg12">
  <div class="ph"><b>12 导联心电图</b><button class="btn" onclick="document.getElementById('pg12').classList.remove('on')" style="padding:6px 12px">返回</button></div>
  <div class="pb"><canvas id="c12"></canvas><div class="meas" id="meas12"></div></div>
</div>

<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============================================================
   ICU 生理监护模拟器
   波形来源:三维心电向量环(VCG) → 12 导联正交投影
   循环动力学 → 血压/血氧/氧输送/酸碱
   ============================================================ */
const DEG=Math.PI/180, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const N=()=>Math.random()*2-1;
const smooth=(x)=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const gauss=(x,s)=>Math.exp(-0.5*(x/s)*(x/s));

/* ---------- 12 导联定义 ---------- */
const LEADS=[
 {n:'I',  f:0,   c:'#39ff88',grp:'limb'},
 {n:'II', f:60,  c:'#39ff88',grp:'limb'},
 {n:'III',f:120, c:'#39ff88',grp:'limb'},
 {n:'aVR',f:-150,c:'#7ee081',grp:'aug'},
 {n:'aVL',f:-30, c:'#7ee081',grp:'aug'},
 {n:'aVF',f:90,  c:'#7ee081',grp:'aug'},
 {n:'V1', v:150, c:'#5fd8ff',grp:'prec'},
 {n:'V2', v:110, c:'#5fd8ff',grp:'prec'},
 {n:'V3', v:90,  c:'#5fd8ff',grp:'prec'},
 {n:'V4', v:60,  c:'#5fd8ff',grp:'prec'},
 {n:'V5', v:30,  c:'#5fd8ff',grp:'prec'},
 {n:'V6', v:0,   c:'#5fd8ff',grp:'prec'},
];
const LI={}; LEADS.forEach((l,i)=>LI[l.n]=i);
// 12导联 3×4 排布 + 底部 II 导联长节律条
const L12=[['I','aVR','V1','V4'],['II','aVL','V2','V5'],['III','aVF','V3','V6']];
// 梗死 / 束支区域掩码
const TERR={ant:[6,7,8,9],inf:[1,2,5],lat:[0,4,10,11]};

/* ---------- 向量分量构造 ----------
   A=额面幅值  B=水平面幅值  f=额面方位角  h=水平面方位角
   额面导联 = A·cos(f−θ)   水平导联 = B·cos(h−φ)              */
function comp(A,B,f,h){
  const F=f*DEG,H=h*DEG;
  return {vx:A*Math.cos(F), vy:A*Math.sin(F), zh:B*Math.cos(H), xh:B*Math.sin(H)};
}
function projLead(c,L){
  return (L.f!==undefined)? (c.vx*Math.cos(L.f*DEG)+c.vy*Math.sin(L.f*DEG))
                          : (c.zh*Math.cos(L.v*DEG)+c.xh*Math.sin(L.v*DEG));
}

/* ---------- 采样缓冲 ---------- */
const FS=250, BUFSZ=16250, BSEC=BUFSZ/FS;   // 65 秒历史(导出最长 60 s,留余量)
const ecgBuf=[]; for(let i=0;i<12;i++) ecgBuf.push(new Float32Array(BUFSZ));
const bufPleth=new Float32Array(BUFSZ);
const bufArt  =new Float32Array(BUFSZ);
const bufResp =new Float32Array(BUFSZ);
const bufCO2  =new Float32Array(BUFSZ);
let gIdx=0;                                  // 全局样本游标
const BEATS=[];                              // 最近的心搏描述符(波形按需重算)
// 确定性伪随机:同一样本索引永远得到同一噪声 → 波形滚动时噪声不闪烁、不残留
function hashNoise(i,seed){
  let x=Math.imul(i|0,374761393)+Math.imul(seed|0,668265263);
  x=Math.imul(x^(x>>>13),1274126177);
  return (((x^(x>>>16))>>>0)/2147483648)-1;    // -1 ~ +1
}
const gmod=(i)=>((i%BUFSZ)+BUFSZ)%BUFSZ;
function samp(buf,t){                        // 按秒取样(线性插值)
  const f=t*FS, i0=Math.floor(f), fr=f-i0;
  const a=buf[gmod(i0)], b=buf[gmod(i0+1)];
  return a+(b-a)*fr;
}
function sampIdx(buf,i){ const j=gmod(i); return buf[j]; }

/* ---------- 全局状态 ---------- */
const S={
  t:0, run:true, timeScale:1,
  // 患者
  age:68, sex:'M', weight:70, hb:135, fio2:0.21, temp:36.8,
  // 基础生理
  base:{ contract:1.0, svr:17.5, vol:100, hrBase:72, rr:14, temp:36.8 },
  // 波形微调(强行调整)
  wave:{ pAmp:1, pWidth:1, pInv:false, qrsAmp:1, qrsWidth:1, stShift:0,
         tAmp:1, tInv:false, axis:0, noise:0.35, wander:0.4, rsa:1, qDepth:0.06 },
  // 波形地形
  land:{ ant:0, inf:0, lat:0, lbbb:0, rbbb:0, qwave:0, lvh:0, rv5:0 },
  // 显示
  view:{ leads:['I','II','III'], rows:100, scanSpeed:2, speed:25, gain:10, grid:true, cal:true,
         rowsOrder:[], trend:true, bigNum:true, traceColor:'channel' },
  alarm:{ hrHi:120, hrLo:50, spo2Lo:90, sbpHi:160, sbpLo:90, dbpHi:100, mapLo:65, rrLo:8, rrHi:25 },

const fx={};

/* ---------- 药效动力学 ---------- */
function fxAdd(key,add,onset,half){ S.drugs.push({key,add,on:onset,half,t:S.t}); if(!fx[key])fx[key]=[]; }
function fxVal(key){
  let v=0;
  for(let i=0;i<S.drugs.length;i++){ const d=S.drugs[i]; if(d.key!==key) continue;
    const age=S.t-d.t; let w=1-Math.exp(-age/d.on); if(age>d.on) w*=Math.exp(-(age-d.on)/d.half);
    v+=d.add*w; }
  return v;
}
function pruneDrugs(){ S.drugs=S.drugs.filter(d=>S.t-d.t<d.half*8); }

/* ============================================================
   1. 心电向量环合成 → 12导联
   ============================================================ */
function baseComp(beat){
  const w=S.wave, a=S.axisUsed||0, aH=(S.axisHUsed||0);
  const ka=1+0.15*w.qrsAmp, kb=1+0.15*w.qrsAmp;
  let c1,c2,c3,kind=beat.qrsKind;
  if(kind==='lbbb'){
    c1=comp(0.10,0.26,60+a,40);
    c2=comp(0.80*ka,1.28*kb,55+a,-18+aH);
    c3=comp(-0.62,-0.52,62+a,38);            // 终末向右后 → V1 深S
  }else if(kind==='rbbb'){
    c1=comp(0.09,0.22,-20+a,75);
    c2=comp(1.00*ka,1.02*kb,58+a,-25+aH);
    c3=comp(0.34,0.62,-58+a,112);             // 终末向左前 → V1 r'
  }else{
    c1=comp(0.075*ka,0.26*kb,-20+a,75);
    c2=comp(1.16*ka,1.32*kb,52+a,-25+aH);
    c3=comp(0.30*ka,0.34*kb,-72+a,-48+aH);
  }
  if(beat.rot){ const R=beat.rot*DEG,ca=Math.cos(R),sa=Math.sin(R);
    [c1,c2,c3].forEach(c=>{const x=c.vx,y=c.vy;c.vx=x*ca-y*sa;c.vy=x*sa+y*ca;}); }
  const lvh=1+0.9*S.land.lvh;
  if(S.land.lvh>0){ c2=comp(1.16*ka*(1+0.55*S.land.lvh),1.32*kb*(1+0.7*S.land.lvh),50+a,-22+aH); }
  if(S.land.rv5>0){ c2=comp(1.16*ka*(1+0.35*S.land.rv5),1.32*kb*(1-0.30*S.land.rv5),112+a,-62+aH); }
  return {c1,c2,c3};
}

// 沿原方向按倍数放大一个向量分量(水平/额面分别缩放)
function scaleC(c,g){ return {vx:c.vx*g, vy:c.vy*g, zh:c.zh*g, xh:c.xh*g}; }
// 波形列表:[分量, 时相(相对R峰), 左σ, 右σ]
/* 把全身状态翻译成这一拍心电图的形态参数
   —— 这是心电图教学最核心的一环:全身情况直接改波形 */
function ecgMods(){
  const K=S.elec.K, Mg=S.elec.Mg, tc=S.temp, D=S.ecgDrug;
  const hypo =clamp((35.6-tc)/2.6,0,1);            // 低温(Osborn J 波)
  const hyperK=clamp((K-5.2)/2.2,0,1);            // 高钾:高尖 T、P 波消失、QRS 增宽
  const hypoK =clamp((3.6-K)/1.1,0,1);            // 低钾:T 低平、ST 压低、U 波、QT 延长
  const hypoMg=clamp((1.6-Mg)/1.0,0,1);            // 低镁:QT 延长
  return {
    tAmpMul : 1 + hyperK*1.25 - hypoK*0.72,        // 高钾 T 高耸;低钾 T 低平
    tWidthMul: 1 - hyperK*0.42,                     // 高钾 T 变窄变尖
    tAxis   : hyperK*(-18),                         // 高钾 T 变对称、指向更居中
    pAmpMul : 1 - hyperK*1.0,                       // 高钾 P 波变钝消失
    qrsWAdd : hyperK*0.9 + D.proc*0.55 + D.amio*0.16 + (tc<34?0.14:0),
    qtAdd   : Math.min(0.17, hypoK*0.085 + hypoMg*0.085 + D.amio*0.11) - hyperK*0.05,
    jWave   : hypo,                                 // 低温 J 波
    dig     : D.dig,                                // 洋地黄鱼钩样 ST
    tremor  : clamp((36.4-tc)/1.8,0,1),             // 寒战肌电
  };
}
function waveList(B,C){
  const M=ecgMods();
  const w=S.wave, ws=B.qrsWidth, L=[];
  if(B.pAmp>0.01&&M.pAmpMul>0.05){
    const pm=M.pAmpMul;
    L.push([comp(B.pAmp*0.15*w.pAmp*pm*(B.pInv?-1:1), B.pAmp*0.08*w.pAmp*pm*(B.pInv?-1:1), B.pAxisF||45, B.pAxisH||35),
            -B.pr, 0.024*w.pWidth*(1+ (1-pm)*1.6), 0.030*w.pWidth*(1+(1-pm)*1.6)]);
  }
  const tilt=1+0.55*S.land.lvh*(S.tiltInv?1:0);
  if(B.pOnly) return L;                       // 脱漏 P 波:仅心房除极,心室未下传
  const gm=B.amp||1;                          // 宽大畸形 QRS 的增益(室早/室速)
  const wq=ws+M.qrsWAdd;                       // 高钾 / 药物 / 低温使 QRS 增宽
  L.push([scaleC(C.c1,gm), -0.026*wq, 0.008*wq, 0.010*wq]);
  L.push([scaleC(C.c2,gm), 0.004,     0.009*wq,0.016*wq]);
  L.push([scaleC(C.c3,gm), 0.038*wq,  0.010*wq,0.013*wq]);
  const qt=(B.qt||0.3)+M.qtAdd;
  let tA=B.tAmp*(B.tInv?-1:1)*tilt*Math.max(0.15,M.tAmpMul);
  L.push([comp(tA*0.32*w.tAmp, tA*0.22*w.tAmp, 48+(B.tAxisF||0)-M.tAxis, -28+(B.tAxisH||0)),
          qt, 0.046*M.tWidthMul, 0.052*M.tWidthMul]);
  // U 波:低钾时 QT 末端出现第二个小波(真实且可辨)
  if(M.pAmpMul<0.99&&S.elec.K<3.9){
    L.push([comp(tA*0.10,-tA*0.06,42,-24), qt+0.075, 0.028, 0.034]);
  }
  // Osborn J 波:低温时 QRS 后出现的正相顿挫
  if(M.jWave>0.05) L.push([comp(0.055*M.jWave,0.02*M.jWave,0,0), 0.060, 0.014, 0.020]);
  B.qtEff=qt; B.qrsW=wq;
  return L;
}
/* ══ 室性异位波形生成器 ══
   三种宽 QRS 心动过速的形态必须一眼可辨,而不是同一张脸换角度:
     单形性 VT — 每次心搏完全同形:宽大、切迹、深 S、宽而钝的 T(与 QRS 同向)
     多形性 VT — 每搏振幅/极性/切迹随机跳变,基线粗乱,无可辨 T 波
     尖端扭转 TdP — 振幅呈正弦包络,包络过零时极性翻转(绕基线旋转),QRS-T 融合
   三者都写进描述符 B.vshape,保证整段历史可回溯重算。
*/
function ventShape(kind,T){
  const rh=curRhythm();
  if(kind==='mono'){
    // 单形性:形态逐拍完全一致 —— 固定的轴(f=矢面 / h=额面)、固定的切迹、宽钝 T
    return { c:[{w:1.00,off:-0.030},{w:0.34,off:0.006},{w:-0.62,off:0.040}],
             f:134, h:-56,                     // 起源在左后上方 → V1/V2 负向、II/III 负向
             notch:0.26, notchAt:0.026, tAmp:0.34, tInv:false, tWide:1.62, axis:0 };
  }
  if(kind==='poly'){
    // 多形性:逐拍重新抽签。用 T 的低频位保证同一次抽签对各导联一致(整体极性翻转)
    const r=hashNoise(Math.floor(T*FS),0), r2=hashNoise(Math.floor(T*FS)+77,0);
    const r3=hashNoise(Math.floor(T*FS)+311,0);
    const flip=(r<0.42)?-1:1;                       // 整拍极性(正/负 QRS)
    const shapeSel=r2;                                // 0..1 选形态
    let c;
    if(shapeSel<0.34)      c=[{w:1.00,off:-0.028},{w:0.40,off:0.006},{w:-0.30,off:0.042}];   // RS 型
    else if(shapeSel<0.67) c=[{w:0.78,off:-0.022},{w:-0.86,off:0.014},{w:0.30,off:0.048}];  // QR 型
    else                   c=[{w:0.52,off:-0.034},{w:-0.48,off:-0.006},{w:1.00,off:0.052}]; // qR 型
    const amp=0.72+0.55*r3;                           // 每拍振幅不同
    // 轴也逐拍乱跳(0..360° 全周随机)—— 这是「多形」的本质
    const af=(r3*360), ah=((r2*2-1)*150);
    return { c, amp:amp*flip, notch:0.10+0.26*Math.abs(Math.sin(T*7.3)), notchAt:0.020+0.016*r2,
             f:af, h:ah, tAmp:0, tInv:false, tWide:1, axis:0 };
  }
  // 尖端扭转:轴沿基线连续旋转 —— 每个 QRS 中心的轴向随时间走过一个正弦周期
  const env=Math.cos((T-0.0)*(TAU*0.62));           // 约 1.6 s 一个完整翻转周期
  const axis=env*168;                                // ±168° 旋转
  const ampJ=0.86+0.22*Math.sin(T*3.1);              // 包络轻微起伏(不是纯正弦)
  const inv=env<0;                                   // 过零后整体反相
  const c=[{w:1.00,off:-0.026},{w:0.46,off:0.008},{w:-0.56,off:0.044}];
  // 轴连续绕基线旋转:从「向左前」(+120° 矢面)扫到「向右后」(-120°)
  return { c, amp:ampJ, notch:0.20+0.10*Math.abs(env), notchAt:0.024,
           f:env*118, h:axis, tAmp:0, tInv:false, tWide:1, axis:0, inv };
}

/* 室性 QRS 的实际形态求值(替换窄 QRS 的分量求值) */
/* 室性起源的 QRS 分量:沿「矢面 fDeg / 额面 hDeg」两个轴分解,
   结构与 baseComp 的 comp() 完全一致,因此 projLead() 可直接投影到 12 导联。
   室性起源默认落在左后方(偏后 + 偏左),这正是 VT 在 V1 呈 QS/负向的原因。 */
function ventComp(a,fDeg,hDeg){
  const F=fDeg*DEG,H=hDeg*DEG;
  return {vx:a*Math.cos(F), vy:a*Math.sin(F), zh:a*Math.cos(H), xh:a*Math.sin(H)};
}
function evalVentBeat(V,tr,L2,baseAmp){
  const ld=LEADS[L2], wq=V.ws;
  let v=0;
  // 三段宽 QRS 分量:主波 R、切迹后回落、深 S(全部沿同一主轴,故各拍形态一致)
  v+=projLead(ventComp(V.c[0].w, V.f,   V.h),ld)*gauss(tr-V.c[0].off, 0.030*wq);
  v+=projLead(ventComp(V.c[1].w, V.f+9, V.h+7),ld)*gauss(tr-V.c[1].off, 0.032*wq);
  v+=projLead(ventComp(V.c[2].w, V.f-14,V.h-11),ld)*gauss(tr-V.c[2].off, 0.040*wq);
  // QRS 顶部切迹(VT 的标志性形态)
  if(V.notch>0.02) v-=V.notch*gauss(tr-V.notchAt, 0.015*wq)*0.85;
  // 宽而钝的 T 波(仅单形性 VT 保留可辨 T;多形/TdP 的 T 与 QRS 融合)
  if(V.tAmp>0.01){
    const ctr=V.qt, up=0.050*V.tWide*wq, dn=0.092*V.tWide*wq;
    v+=projLead(ventComp(V.tAmp*(V.tInv?-1:1), V.f+V.axis, V.h+V.axis*0.6),ld)
       *(tr<ctr?gauss(tr-ctr,up):gauss(tr-ctr,dn));
  }
  return v*baseAmp;
}

// 平台形分量(ST 段)
function plateau(tr,ctr,w,p){ const e=w*0.30; let v=0;
  if(tr>ctr-e&&tr<ctr+w+e) v=p*smooth((tr-(ctr-e))/e)*smooth(((ctr+w+e)-tr)/e); return v; }

/* 把一个心搏模板写进环形缓冲 */
const TMPL_PRE=0.32;                          // R 峰之前的回填窗
/* 心搏 → 任意时刻某导联的取值(纯形态,不含噪声/伪差)
   每个心搏保存描述符,波形由 evalLead 按需实时求值:
   这样改动任何波形参数都能立刻对整段历史重新生效,且不会残留旧数据 */
function evalBeat(B,tr,L2){
  const ld=LEADS[L2];
  const ws=B.qrsWidth, C=B.C||(B.C=baseComp(B)), L=B.L||(B.L=waveList(B,C));
  // 宽 QRS 室性心搏:形态完全由 ventShape 决定,不经过窄 QRS 分量表
  if(B.ventWide&&B.vshape) return evalVentBeat(B.vshape,tr,L2,B.amp||1.85)*(B.vshape.inv?-1:1);
  let v=0;
  for(let k=0;k<L.length;k++){
    const wc=L[k], d=tr-wc[1];
    if(d<-0.22||d>0.42) continue;
    v+=projLead(wc[0],ld)*(d<0?gauss(d,wc[2]):gauss(d,wc[3]));
  }
  // 病理性 Q 波
  const qw=S.land.qwave;
  if(!B.pOnly&&qw>0&&tr>-0.022&&tr<0.032){
    const g=gauss(tr-0.006,0.011);
    if(TERR.ant.indexOf(L2)>=0) v-=qw*g;
    if(TERR.inf.indexOf(L2)>=0) v-=qw*1.15*g;
    if(TERR.lat.indexOf(L2)>=0) v-=qw*0.80*g;
  }
  // ST 段偏移(区域性 + 全局)
  if(!B.pOnly&&tr>0.030&&tr<(B.qtEff||B.qt||0.3)*0.72){
    const M=ecgMods();
    let e=S.wave.stShift;
    if(TERR.ant.indexOf(L2)>=0) e+=S.land.ant;
    if(TERR.inf.indexOf(L2)>=0) e+=S.land.inf;
    if(TERR.lat.indexOf(L2)>=0) e+=S.land.lat;
    // 低钾的 ST 压低
    if(S.elec.K<3.6) e-=clamp((3.6-S.elec.K),0,1.2)*0.14;
    // 心肌缺血:静息 + 应激,ST 压低呈区域性(前壁/下壁/侧壁)
    const is=S.isch;
    if(is.sev>0){
      if(TERR.ant.indexOf(L2)>=0) e-=is.sev*(0.16+0.22*is.on);
      if(TERR.inf.indexOf(L2)>=0) e-=is.sev*(0.20+0.28*is.on);
      if(TERR.lat.indexOf(L2)>=0) e-=is.sev*(0.12+0.18*is.on);
    }
    const qt=B.qtEff||B.qt||0.3;
    v+=plateau(tr,0.052,qt*0.62-e,e*smooth((tr-0.030)/0.03));
    // 洋地黄效应:ST 段特征性「鱼钩样」下斜(aVR、V5 最典型)
    if(M.dig>0.02){
      const tiltD=tr-0.05;
      if(tiltD>0&&tiltD<0.16){
        const scoop=-M.dig*0.20*Math.sin(Math.PI*clamp(tiltD/0.16,0,1))*0.8
                    -M.dig*0.10*clamp(tiltD/0.16,0,1);
        v+=scoop*(L2===3||L2===10||L2===4?1:0.5);
      }
    }
  }
  return v;
}
function beatSpan(B){ return 0.34+Math.min(0.55,(B.qt||0.3)+0.12); }
// 某一绝对时刻 t 的第 L2 导联纯净形态值
function evalLead(t,L2){
  const _r=curRhythm();
  if(_r.vf) return vfSample(t,L2);
  if(_r.flutterV) return vflSample(t,L2);
  let v=atrialNoise(t,L2);
  const bt=BEATS;
  for(let k=bt.length-1;k>=0;k--){
    const b=bt[k];
    if(t>b.t+0.02 && t-b.t>beatSpan(b.B)) break;      // 更早的心搏已超出窗口
    if(t>=b.t-0.34&&t<=b.t+beatSpan(b.B)) v+=evalBeat(b.B,t-b.t,L2);
  }
  return v;
}
// 用心搏描述符重建整个环形缓冲区(启动 / 参数改变后调用)
function renderBuf(span){
  span=span||BSEC;
  const ai1=gIdx, n=Math.min(BUFSZ,Math.round(span*FS)), ai0=ai1-n+1;
  for(let L2=0;L2<12;L2++){
    const b=ecgBuf[L2];
    for(let ai=ai0;ai<=ai1;ai++) b[gmod(ai)]=evalLead(ai/FS,L2);
  }
  S.sigDirty=false;
}
// 波形参数改变:清掉缓存的向量分量,重建可见段
function markDirty(){
  for(let i=0;i<BEATS.length;i++){ BEATS[i].B.C=null; BEATS[i].B.L=null; }
  S.sigDirty=true; S.sigDirtyAt=S.t;
}

/* ============================================================
   2. 心律引擎
   ============================================================ */
const RHY={
 sinus:{n:'窦性心律',rate:1.0,p:true,pr:.16,qrs:.09,qw:1.0,t:1.0,arr:0,alias:'sinus'},
 // 窦速 / 窦缓 不再是独立心律,而是窦性心律下的 HR 档位(见 SINUS_TIER)
 sinusT:{n:'窦性心动过速',rate:1.9,p:true,pr:.14,qrs:.09,qw:1.0,t:.8,arr:.03,alias:'sinus'},
 sinusB:{n:'窦性心动过缓',rate:.62,p:true,pr:.20,qrs:.10,qw:1.0,t:1.3,arr:.02,alias:'sinus'},
 rsa:{n:'呼吸性窦性心律不齐',rate:1.0,p:true,pr:.17,qrs:.09,qw:1.0,t:1.0,arr:.28},
 af:{n:'心房颤动',rate:1.0,p:false,pr:0,qrs:.09,qw:.95,t:1.0,arr:.35,fibA:true},
 afl:{n:'心房扑动(2:1)',rate:1.9,p:false,pr:.16,qrs:.09,qw:.95,t:1.0,arr:.06,flutter:true},
 svt:{n:'阵发性室上速',rate:2.8,p:false,pr:.10,qrs:.08,qw:.9,t:.7,arr:.02,retro:true},
 // 单形性室速:形态完全一致的宽大 QRS,每个心动周期同形,轴固定
 vt:{n:'单形性室速',rate:4.4,p:false,pr:0,qrs:.17,qw:0,t:.62,arr:.03,wide:true,rot:1,pulse:true,hrMax:230},
 // 多形性室速:每搏 QRS 形态/振幅/轴都变,无规律周期 → 没有可辨认的 T 波
 vtn:{n:'多形性室速',rate:4.6,p:false,pr:0,qrs:.17,qw:0,t:0,arr:.55,wide:true,poly:true,pulse:true,hrMax:240},
 // 尖端扭转型室速:宽 QRS 振幅与极性沿基线周期性翻转(轴绕基线旋转),T 波与 QRS 融合
 tdp:{n:'尖端扭转型室速',rate:4.2,p:false,pr:0,qrs:.17,qw:0,t:0,arr:.22,wide:true,twist:true,pulse:true,hrMax:220},
 pvc:{n:'频发室性早搏',rate:1.05,p:true,pr:.17,qrs:.09,qw:1.0,t:1.0,arr:0,pvc:.28},
 avb1:{n:'Ⅰ度房室传导阻滞',rate:1.0,p:true,pr:.30,qrs:.10,qw:1.0,t:1.1,arr:.03},
 avb2:{n:'Ⅱ度房室传导阻滞',rate:1.3,p:true,pr:.22,qrs:.10,qw:1.0,t:1.1,arr:.05,drop:true,conduct:0.55},
 avb3:{n:'Ⅲ度房室传导阻滞',rate:1.0,p:true,pr:0,qrs:.14,qw:1.0,t:1.2,arr:.02,junc:true,complete:true},
 ag:{n:'心室停搏',rate:0,p:false,pr:0,qrs:0,qw:0,t:0,arr:0,asys:true},
 // 室扑:介于单形性 VT 与 VF 之间 —— 正弦样连续波,无基线、无可辨 QRS-T
 vfl:{n:'心室扑动',rate:4.0,p:false,pr:0,qrs:0,qw:0,t:0,arr:.30,flutterV:true,pulse:true,hrMax:300},
 pea:{n:'无脉性电活动',rate:.85,p:false,pr:0,qrs:.17,qw:0,t:0,arr:.25,wide:true,rot:1,asys:true,org:true},
 vf:{n:'心室颤动',rate:0,p:false,pr:0,qrs:0,qw:0,t:0,arr:0,vf:true},
};
function curRhythm(){ const R=RHY[S.rhythmForce||S.rhythm]||RHY.sinus;
  // 窦速/窦缓:心律本身仍是窦性,形态细节由当前心率所在的档位决定
  if(R.alias==='sinus'){ const T=sinusTierOf(S.hr);
    R.pr=T.pr; R.qrs=T.qrs; R.t=T.t; R.arr=T.arr; R._tier=T.n; }
  return R; }
/* 窦性心律的频率档位 —— 窦速/窦缓不是独立心律,只是同一个窦性节律的不同心率区间。
   档位决定心率目标区间与 P-QRS-T 的形态细节(窦速时 PR 缩短、T 变窄;窦缓时相反)。*/
const SINUS_TIER=[
  {n:'窦性心律',   rate:1.0, pr:.16, qrs:.09, t:1.0, arr:0,     lo:60,  hi:100},
  {n:'窦性心动过速', rate:1.9, pr:.14, qrs:.09, t:.80, arr:.03,  lo:100, hi:220},
  {n:'窦性心动过缓', rate:.62, pr:.20, qrs:.10, t:1.30, arr:.02,  lo:25,  hi:60},
];
function rhyName(){ const R=RHY[S.rhythmForce||S.rhythm]||RHY.sinus;
  return (R.alias==='sinus')?sinusTierOf(S.hr).n:R.n; }
function sinusTierOf(hr){ const h=hr||S.hr||70;
  return h>100?SINUS_TIER[1]:(h<60?SINUS_TIER[2]:SINUS_TIER[0]); }

/* 房性电活动(AF/AFL 底噪) */
function atrialNoise(t,L2){
  const rh=curRhythm();
  let v=0;
  if(rh.fibA){ v=(Math.sin(t*11.3+L2)*0.5+Math.sin(t*7.1+L2*2)*0.3+Math.sin(t*17.7)*0.2)*0.028
              +(Math.sin(t*23)+Math.sin(t*31))*0.008; }
  else if(rh.flutter){ v=Math.sin(t*TAU*5.0+L2*0.6)*0.105; }
  return v;
}

function stepRhythm(){
  const rh=curRhythm();
  if(rh.vf){ /* 由 loopVF 处理 */ }
  if(S.pulsePresent===false && !rh.org && !rh.asys){}
  // 到下一拍
  const rr=60/S.hr;
  const cycle=rh.asys&&rh.org?1.0:(rh.junc&&rh.complete?0.55:0.0001);
  let gap=rh.complete?60/38:(rh.asys&&rh.org?rr:rr);
  if(S.rhythmForce==='avb2'||rh.drop){
    if(Math.random()<0.45){ /* 漏搏 */ S.nextBeat+=gap*rnd(1.9,2.1); return; }
  }
  S.nextBeat+=gap;
}

function makeBeatDesc(T){
  const rh=curRhythm(), w=S.wave;
  T=(T===undefined)?S.nextBeat:T;
  S.axisUsed=S.wave.axis; S.axisHUsed=0;
  const isPVC=(rh.pvc&&Math.random()<rh.pvc);
  const B={ t:T, pr:rh.pr||0.14, qrsWidth:((rh.qrs||0.09)/0.09)*w.qrsWidth,
            qt:0, pAmp:rh.p?1:0, tAmp:rh.t===0?0:(rh.t||1),
            tInv:false, qrsKind:(S.land.lbbb>0.5?'lbbb':(S.land.rbbb>0.5?'rbbb':null)),
            rot:0, dur:0 };
  if(isPVC||rh.wide){
    B.pAmp=0;
    B.qrsWidth=isPVC?Math.max(1.7,(rh.qrs||0.16)/0.09):((rh.qrs||0.16)/0.09);
    // ── 宽 QRS 的独立形态:三型 VT 各用各的生成器;室早用单形性的一个固定变体
    if(rh.twist)      B.vshape=ventShape('twist',T);
    else if(rh.poly)  B.vshape=ventShape('poly', T);
    else              B.vshape=ventShape('mono',T);     // 单形性 VT 与室早共用(形态本就该一致)
    if(isPVC){ B.vshape=Object.assign({},B.vshape,{notch:0.30,axis:(Math.random()<0.5?38:-42)}); }
    B.vshape.qt=B.qt||0.34;
    B.vshape.ws=B.qrsWidth*(1+(ecgMods().qrsWAdd||0))*0.5;
    B.vshape.inv=B.vshape.inv||false;
    // T 波:单形性 VT 有宽钝 T(与 QRS 同向);多形/TdP 的 T 与 QRS 融合 → 不单列
    B.tAmp = B.vshape.tAmp; B.ventWide=true;
    B.amp=rh.vf?1:(rh.pulse?1.85:1.55); B.pulseOK=!!rh.pulse;   // 室性起源 QRS 宽大畸形
  }
  // 二度房室传导阻滞:按传导比例决定本次是否下传
  if(rh.drop){ B.pOnly=Math.random()>rh.conduct; if(!B.pOnly) B.pvc=1; }
  if(rh.retro) B.pAmp=0;
  if(B.pOnly) B.tAmp=0;
  if(rh.junc&&rh.complete){ B.pAmp=0; B.pr=0; }
  B.pr=clamp(B.pr*(isPVC?1:1),0.06,0.36);
  const rr=S.nextRR||(60/Math.max(30,S.hr));
  B.qt=clamp(0.40*Math.sqrt(Math.max(0.25,rr))*w.qrsWidth+ecgMods().qtAdd,0.20,0.66);
  if(B.vshape) B.vshape.qt=B.qt;
  B.rr=rr; B.dur=Math.max(B.qt+0.14, rr);
  const _M=ecgMods();
  S.prInt=B.pr; S.qtInt=B.qt; S.qrsInt=0.09*(B.qrsWidth+_M.qrsWAdd);
  return B;
}

/* ============================================================
   3. 循环动力学 (Windkessel / Guyton 简化回路)
   SV = EDV − ESV ;  EF∝收缩力 ;  EDV∝血容量 ;  CO=HR·SV
   MAP = CO·SVR + CVP ;  PP = SV / 动脉顺应性
   ============================================================ */
function hemodynamics(dt){
  const rh=curRhythm();
  // --- 药效叠加
  let contract=clamp(S.base.contract+fxVal('contract'),0.03,2.4);
  let svr=clamp(S.base.svr+fxVal('svr'),4,45);
  let vol=clamp(S.base.vol+fxVal('vol'),35,180);
  // --- 酸中毒/缺氧/发热 抑制收缩力
  const acid=clamp((7.32-S.ph)*1.2,0,0.25);
  contract*=clamp(1-acid,0.78,1);
  contract*=clamp(1-Math.min(0.28,Math.max(0,S.lactate-2)*0.028),0.74,1);
  contract*=clamp(1-Math.max(0,S.temp-39)*0.12,0.4,1);
  // --- 停搏
  if(!S.pulsePresent) contract*=0.02;
  // 除颤后心肌顿抑
  if(S.stun>0) contract*=clamp(S.stun,0.15,1);
  // 交感代偿:早期靠血管收缩把血压撑住;储备耗竭后这部分代偿消失 → 血压断崖
  const comp=(S.prog.comp===undefined?1:S.prog.comp);
  const sDrop=clamp(1-Math.max(0,(S.vrate||S.hr||70)-70)*0.0035,0.62,1);
  svr*=lerp(sDrop,1.0,1-comp);
  svr*= 1 + 0.95*S.lesion.pe + 1.10*S.lesion.tension;   // 肺栓塞/气胸:急性代偿性血管收缩
  S.contract=contract; S.svr=svr; S.vol=vol;
  // --- 搏出量
  const preload=vol/100;
  const edv=120*preload*(1+0.08*(contract-1));
  // 射血分数 EF = 收缩力决定,SV = EDV × EF  (收缩力↓ → EF↓ → SV↓)
  const ef=clamp(0.58*contract,0.05,0.75);
  let svMax=edv*ef;
  // 心率过快 → 充盈不足; 过缓 → 有上限
  const fill=clamp(1-Math.max(0,(S.vrate||S.hr||70)-110)*0.010,0.45,1);   // 心率↑ → 充盈时间↓
  svMax*=fill;
  // 后负荷失配
  svMax*=clamp(1-Math.max(0,(S.map||90)-112)*0.010,0.45,1);   // 后负荷失配
  // 室性心律:心室在做无效的快速同步收缩,顺行射血分数极低,并随时间进一步衰竭
  /* ── 结构性急症 ──
     心包填塞:心室被压塌 → 前负荷骤降,同时静脉压急剧升高(标志性「低血压 + 高中心静脉压」)
     急性肺栓塞:右心室急性衰竭 → 左心前负荷↓ + 神经体液性血管收缩 + 通气/血流比失调
     张力性气胸:胸腔内压升高 → 静脉回流受阻 + 纵隔移位导致循环阻力↑ */
  const L=S.lesion;
  if(L.tamp>0){ svMax*=1-0.62*L.tamp; }
  if(L.pe>0){   svMax*=1-0.42*L.pe; }
  if(L.tension>0){ svMax*=1-0.62*L.tension; }
  if(rh.wide&&rh.pulse) svMax*=S.prog.vtEff;
  svMax=clamp(svMax,0,150);
  if(!S.pulsePresent) svMax=0;            // 停搏:心室不射出任何血液
  // --- 流量与压力
  const hrEff=S.pulsePresent?(S.vrate||S.hr):0;
  const co=hrEff*svMax/1000;
  /* ── 出入量平衡:尿量由肾灌注压驱动;输液与不显性失水持续改变血容量 ──
     血容量 100% ≈ 50 mL/1%(70 kg×70 mL/kg),尿量和补液都作用在这一格上 */
  const UO=clamp((S.map-42)*0.055,0,1.25)*S.weight;          // mL/h 尿量
  S.io.urineRate=clamp(S.map<38?0:UO,0,120);
  const ins=(26+Math.max(0,S.temp-37)*18)*S.waterLoss;        // mL/h 不显性失水
  S.io.insens=ins;
  S.io.infuse=clamp(S.io.rate||0,0,500);
  S.io.urineTotal+=S.io.urineRate*dt/3600;
  S.io.insensTotal=(S.io.insensTotal||0)+ins*dt/3600;
  S.io.infTotal=(S.io.infTotal||0)+S.io.infuse*dt/3600;
  S.io.balance=S.io.infTotal-(S.io.urine+S.io.insensTotal);
  S.io.dBal=(S.io.infuse-S.io.urineRate-S.io.insens)*dt/3600;   // 本步净变化 mL
  if(S.prog.on&&!S.dead) S.base.vol=clamp(S.base.vol+S.io.dBal/50,35,160);

  // 中心静脉压:无脉时静脉血池也持续回流到组织,必须按上一帧的 cvp 衰减
  // (若每帧从公式重推,指数衰减会被抵消成不动点)
  let cvp=clamp(2+0.18*(vol-80),0,26);
  if(S.cvp!==undefined&&(!S.pulsePresent||S.map<28)) cvp=clamp(S.cvp*Math.exp(-dt/(S.pulsePresent?6:7.5)),0,26);
  cvp=clamp(cvp+ 30*S.lesion.tamp + 6*S.lesion.pe, 0,40);   // 填塞把静脉血挤进胸腔
  const map=co*svr+cvp;
  S.sv=svMax; S.co=co; S.cvp=cvp; S.map=map;
  // 顺应性随压力下降
  const cart=1.35*(1+0.0045*(map-80));
  const pp=clamp(svMax/Math.max(0.6,cart),0,110);
  S.pp=pp;
  // --- 血压绝对值
  let m=map, p=pp;
  if(S.pulseFade>0){
    // 室颤/无脉发生后的「残余血压」期:主动脉内残血继续向外周流动,
    // 动脉导管有惯性 → 最初几秒仍能读到微弱但确实存在的压力
    S.pulseFade=Math.max(0,S.pulseFade-dt);
    const k=Math.exp(-(S.fadeT0-S.pulseFade)/1.9);   // 已经过的时间 → 压力指数衰减
    m=S.fadeMAP*k; p=S.fadePP*k;
    S.pp=p; S.pulse=(S.pulseFade>0.25)?clamp(S.fadeHR*(0.25+0.75*k),0,220):0;
    if(S.pulseFade<=0) S.pulsePresent=false;
  }else if(!S.pulsePresent){
    m=m*Math.exp(-dt/2.6); p=p*Math.exp(-dt/1.7);
    S.pulse=0;
  }
  S.sbp=m+p*0.66; S.dbp=m-p*0.34;
  if(S.mapLock>0) m=S.mapLock;
  S.sbp=clamp(S.sbp,0,260); S.dbp=clamp(S.dbp,0,180); S.map=clamp(m,0,200);
  // --- CPR 维持灌注:胸外按压把 MAP 维持在 40–70 mmHg(深度越大维持越高)
  // 用专属的跨帧变量累积,不受每帧重推的 m/p 影响
  if(S.cpr.active&&!S.pulsePresent&&S.pulseFade<=0){
    const g2=clamp(dt/0.8,0,1);
    S.cprPrev=lerp(S.cprPrev===undefined?S.map:S.cprPrev,
                   clamp(38+S.cpr.depth*4+(S.cpr.depth>=5?8:0),20,70),g2);
    S.cprPP  =lerp(S.cprPP  ===undefined?S.pp  :S.cprPP,
                   clamp(24+S.cpr.depth*2.4,8,70),g2);
    S.map=S.cprPrev; S.pp=S.cprPP;
    S.sbp=clamp(S.map+S.pp*0.66,0,150); S.dbp=clamp(S.map-S.pp*0.34,0,110);
  }else{ S.cprPrev=undefined; S.cprPP=undefined; }
  // --- 温度效应
  S.temp=S.base.temp+fxVal('temp')+ (S.fever||0);
  const tDev=S.temp-37;
  S.base.hrBase=clamp(S.base.hrBase+0,40,180);
  // --- 心率来源
  let hr=S.base.hrBase;
  hr+=fxVal('hrAdd');
  hr+=tDev*10;                                  // 发热
  hr+=clamp((S.vol-100)*0.06,-14,14);           // 容量反应(Frank-Starling 变)
  hr*=clamp(1-Math.max(0,S.temp-39)*0.06,0.6,1);
  // ① 心律自身的频率(窦速 / 室上速 / 室速…)
  const _rh=curRhythm();
  if(S.hrLock>0) hr=S.hrLock;
  else if(_rh.complete) hr=42;                   // 完全性房室传导阻滞:逸搏心率
  else hr*=(_rh.rate||1);
  // ② 失代偿性心动过速:叠加在基础频率之上,受交感储备限制
  if(S.hrLock<=0){
    hr+=clamp((70-(S.map||90))*2.0,0,45)*(0.45+0.55*(S.prog.comp===undefined?1:S.prog.comp));
    if(S.vol<100) hr*=1+(100-S.vol)*0.005;      // 容量丢失 → 乘性心率上升(失代偿)
    if(_rh.wide) hr=Math.min(hr,235);            // 室性心律心率上限
  }
  // 窦性心律不齐 / 呼吸性变异
  if(S.rhythmForce==='rsa'||S.rhythm==='rsa'){
    hr*=1+0.22*S.wave.rsa*Math.sin(TAU*(S.inspPhase||0)+0.6);
  }
  if(!S.pulsePresent&&!_rh.org) hr=0;            // 无有效电活动 → 心率 0(PEA 除外)
  if(S.dead) hr=0;
  // 心率上限:按心律各自的最高可发放频率(窦性 220,室速 230/240/220,其他 300)
  S.hr=clamp(hr,0,S.pulsePresent?((_rh.hrMax)||300):300);
  if(S.pulseFade<=0) S.pulse=S.pulsePresent?Math.round(S.vrate||S.hr):0;
  if(!rh.drop&&!rh.complete) S.vrate=S.hr;
}

/* ============================================================
   4. 气体交换 / 氧输送 / 酸碱
   ============================================================ */
function gasExchange(dt){
  // --- 分钟通气量:Vt 6.5 mL/kg,死腔 2.2 mL/kg
  const Vt=7.1*S.weight/1000*Math.min(1.7,1+Math.max(0,S.lactate-1)*0.10+Math.max(0,S.temp-37)*0.02);
  const Vd=2.2*S.weight/1000;
  const rrEff=S.mechVent?Math.max(12,S.rrInt):S.rrInt;
  const VA=Math.max(0.15,rrEff*(Vt-Vd));                 // 肺泡通气量 L/min
  const vco2=3.2*S.weight*(1+Math.max(0,S.temp-37)*0.14);// CO₂ 产生量 mL/min
  if(!S.mechVent&&S.rrInt<=0){
    S.paco2=clamp(S.paco2+(5/60)*dt,10,150);             // 呼吸暂停:PaCO₂ ↑5 mmHg/min
  }else{
    const target=clamp(0.863*vco2/VA,12,150);   // PaCO₂ = 0.863·VCO₂/VA
    const up=target>S.paco2;
    const rate=S.mechVent?1.2:(up?0.5:0.35);
    S.paco2=clamp(S.paco2+(target-S.paco2)*clamp(rate*dt,0,1),10,150);
  }
  // --- 肺泡气方程
  const pao2f=S.fio2*(760-47)-S.paco2/0.8;
  // --- A-a 梯度:年龄 + 肺内分流(低氧/低灌注)
  const ageGap=3+S.age*0.12;
  const shunt=clamp(0.02+0.16*S.lesion.pe+Math.max(0,(97-S.sao2))/45*0.22
            +Math.max(0,(68-S.map))/90*0.10,0,0.55);
  const gap=ageGap+shunt*150+Math.max(0,1-S.fio2/0.21)*20;
  const pao2=clamp(pao2f-gap,18,660);
  S.pao2=lerp(S.pao2,pao2,clamp(dt*0.35,0,1));
  // --- Severinghaus 氧解离曲线(含 pH 校正)
  const n=2.7,P50=(26.6)*(S.ph<7.4?Math.pow(10,0.3*(7.4-S.ph)):1);
  const sao2=clamp(Math.pow(S.pao2,n)/(Math.pow(S.pao2,n)+Math.pow(P50,n))*100,25,100);
  S.sao2=lerp(S.sao2,sao2,clamp(dt*0.45,0,1));
  S.spo2=clamp(S.sao2+fxVal('spo2'),25,100);
  if(S.spo2Lock) S.spo2=S.spo2Lock;
  // --- 氧输送 / 氧耗
  const vo2=clamp(3.5*S.weight*(1+Math.max(0,S.temp-37)*0.14)+fxVal('vo2'),120,700);
  S.vo2=vo2;
  const cao2=1.34*S.hb*(S.sao2/100)+0.003*S.pao2;      // ml/dL
  const do2ml=cao2*S.co;                                  // ml/min = CaO₂(dL/dL·mL/dL)×CO
  S.dox=do2ml/vo2;                                       // DO₂/VO₂
  const svo2t=clamp((do2ml-vo2)/Math.max(1,1.34*S.hb*S.co)*100,20,92);
  S.svo2=lerp(S.svo2,svo2t,clamp(dt*0.08,0,1));
  // --- 组织缺氧 → 乳酸 → 酸碱
  const o2def=S.dox<2.8?Math.max(0,(2.8-S.dox)*0.11):0;
  S.lactate=clamp(S.lactate+(o2def-0.010)*dt,0.1,12);
  if(!S.pulsePresent) S.lactate=clamp(S.lactate+0.010*dt,0.1,12);
  const hco3=clamp(24-(S.lactate>1?(S.lactate-1)*1.6:0),6,30);
  S.ph=clamp(6.1+Math.log10(hco3/(0.03*S.paco2)),6.9,7.65);
  S.baseExc=-(hco3-24.4);
  // --- 低体温 → 氧曲线左移(去饱和变慢)
  if(S.temp<33) S.sao2*=clamp(1+(33-S.temp)*0.008,0.85,1);
}

/* ============================================================
   5. 压力 / 脉搏波 / 呼吸波 / 呼末 CO2
   ============================================================ */
function aorticShape(tr,psys,pdia){
  // tr: 距收缩起始(≈R峰)时间
  const up=0.075+0.35/Math.max(20,S.hr);
  if(tr<0) return pdia;
  if(tr<up){ const a=smooth(tr/up); return pdia+(psys-pdia)*a; }
  const pes=pdia+0.30*(psys-pdia);
  const tau=clamp(1.15*(0.9/Math.max(25,S.hr/60)),0.28,1.5);
  return pes+(psys-pes)*Math.exp(-(tr-up)/tau);
}
function waveforms(dt){
  const A=S.art, rh=curRhythm();
  // 有创动脉压:主动脉 Windkessel → 二阶欠阻尼系统 → 桡动脉重搏切迹
  const tr=(S.t-S.art.lastBeatT);
  const up=0.075+0.35/Math.max(20,S.hr);
  const ua=aorticShape(tr,S.sbp,S.dbp)-S.map;
  const fn=clamp(3.0+S.hr*0.006,2.4,6.2), wn=TAU*fn, z=0.34;
  const acc=wn*wn*(ua-A.y)-2*z*wn*A.dy;
  A.dy=clamp(A.dy+acc*dt,-9000,9000);
  A.y+=A.dy*dt;
  if(!isFinite(A.y)){A.y=0;A.dy=0;}
  if(!S.pulsePresent){ A.y*=Math.exp(-dt*2.2); A.dy*=Math.exp(-dt*3); }
  const artP=S.map+A.y;
  const i=gmod(gIdx);
  bufArt[i]=S.pulsePresent?clamp(artP,0,260):lerp(bufArt[i],0,clamp(dt*1.4,0,1));
  A.peak=Math.max(A.peak,artP); A.trough=Math.min(A.trough,artP);
  // 脉搏波(PPG):只保留物理形态,运动伪差在渲染时叠加
  if(S.pulsePresent){
    const n=clamp((artP-S.dbp)/(Math.max(4,S.pp)+0.001),-0.4,1.9);
    bufPleth[i]=clamp(Math.pow(Math.max(0,n),1.18)*0.80+0.36,0,2.2);
  }else{
    bufPleth[i]=0.06+0.05*Math.sin(S.t*1.7);
  }
  // 呼吸(阻抗法)
  S.inspPhase=(S.inspPhase+(S.rrInt/60)*dt)%1;
  let resp=Math.sin(TAU*S.inspPhase)*0.5+Math.sin(TAU*S.inspPhase*2)*0.12;
  if(S.apnea&&!S.mechVent) resp*=Math.exp(-dt*0.7);
  if(S.mechVent) resp=Math.sin(S.t*TAU*Math.max(0.2,S.rrInt/60))*0.42+(S.cpr.active?Math.sin(S.t*TAU*1.6)*0.14:0);
  bufResp[i]=resp;
  // 呼末二氧化碳
  if(S.pulsePresent||S.mechVent){
    const ph=S.inspPhase;
    const et=S.paco2*0.96, base=2;
    let co2=base;
    if(ph>0.72){ const u=(ph-0.72)/0.28; co2=lerp(et,base,Math.pow(u,1.6)); }
    else if(ph>0.55){ co2=lerp(base,et,Math.pow((ph-0.55)/0.17,0.8)); }
    bufCO2[i]=co2;
  } else bufCO2[i]=0;
  S.etco2=bufCO2[i];
}
function gidx(){ return gmod(gIdx); }

/* ============================================================
   6. NIBP 振荡法袖带
   ============================================================ */
function nibpStep(dt){
  const N=S.nibp;
  if(N.st==='idle') return;
  const rate=(N.st==='inflate')?N.inflate:N.deflate;
  N.cuff=clamp(N.cuff+(N.st==='inflate'?1:-1)*rate*dt,0,240);
  const target=clamp(S.sbp+70,160,220);
  if(N.st==='inflate'&&N.cuff>=target){ N.cuff=target; N.st='deflate'; log('袖带加压至 '+Math.round(N.cuff)+' mmHg,开始放气'); beep(1200,.06,.05); }
  if(N.st==='deflate'&&N.cuff<=Math.max(30,S.dbp-30)){ finishNibp(); return; }
  // 振荡幅度包络:非对称高斯,峰值在 MAP 处
  //   上升支 σ 使 ratio=0.25 恰好落在真实收缩压 → 收缩压法
  //   下降支 σ 使 ratio=0.72 恰好落在真实舒张压 → 舒张压法
  let amp=0;
  if(N.st==='deflate'&&N.cuff<S.sbp+6){
    const span=Math.max(8,S.sbp-S.dbp);
    const u=(S.sbp-N.cuff)/span;                     // 0=收缩压, 1=舒张压
    const uMax=clamp((S.sbp-S.map)/span,0.20,0.80);
    // sR 使 ratio=0.25 落在收缩压;sF 使 ratio=0.72 落在舒张压
    const sR=clamp(uMax/1.177,0.15,0.60), sF=clamp((1-uMax)/0.6005,0.15,0.70);
    const sg=(u<uMax)?sR:sF;
    if(u>=0) amp=Math.exp(-Math.pow((u-uMax)/sg,2))*clamp(S.pp/45,0.2,1.8);
  }
  // 袖带振荡:基频 = 心率,幅度由包络 amp 调制
  // 短窗平滑(真实监护仪同样对振荡包络做滤波)
  N.ampF=(N.ampF||0)+ (amp-(N.ampF||0))*0.22;
  if(N.ampF>N.peak){ N.peak=N.ampF; N.peakCuff=N.cuff; }
  else if(N.peak>0.05&&N.ampF<N.peak*0.985) N.desc=1;      // 进入下降支
  N.hist.push({cuff:N.cuff,amp:N.ampF*(1+Math.min(0.8,motionAt(S.t)*0.5))});
  if(N.hist.length>900) N.hist.shift();
  if(N.st==='deflate'&&N.peak>0.15){
    const r=N.ampF/N.peak;
    if(!N.sbpx&&r>=0.25) N.sbpx=Math.round(N.cuff);
    if(N.sbpx&&!N.dbpx&&N.desc&&N.cuff<N.sbpx-6&&(r<=0.72||r<0.15)) N.dbpx=Math.round(N.cuff);
  }
  S.cuff=N.cuff;
}
function finishNibp(){
  const N=S.nibp;
  if(!N.peak){ N.st='idle'; S.cuff=0; return; }
  // 阈值未捕获时的兜底(最大振幅法 + 经验脉压换算)
  if(!N.sbpx) N.sbpx=Math.round(N.peakCuff+Math.max(12,N.peak*22));
  if(N.dbpx>=N.sbpx-4) N.dbpx=Math.round(N.peakCuff-Math.max(8,N.peak*16));
  if(!N.dbpx) N.dbpx=Math.round(N.peakCuff-Math.max(8,N.peak*16));
  const sbp=clamp(N.sbpx,20,260), dbp=clamp(N.dbpx,10,200);
  const map=clamp(Math.round(N.peakCuff),20,220);   // 最大振幅法:平均压 = 振幅最大时的袖带压
  S.nibpRes={sbp,dbp,map,t:Date.now()};
  log('NIBP 完成:'+sbp+'/'+dbp+'  MAP '+map);
  beep(2000,.08,.06); setTimeout(()=>beep(2000,.08,.06),120);
  N.st='idle'; S.cuff=0; N.hist=[];
}

   7. 除颤 / 同步电复律
   ============================================================ */
const DEFIB_STEPS=[50,70,100,120,150,170,200,240,300,360];
function defibSetE(d){ S.defib.e=clamp(d,20,400); if(S.defib.st==='ready'||S.defib.charged){S.defib.st='charging';S.defib.ch=0;S.defib.charged=false;} }
function defibCharge(){ const D=S.defib; if(D.st==='ready')return; D.st='charging'; D.ch=0; D.charged=false;
  if(!S.cheat.infEnergy) D.batt=clamp(D.batt-0.3,0,100);
  startTone(140+ (D.e/360)*420, 1.0); }
function defibAbort(){ const D=S.defib; if(D.st!=='fired'){D.st='idle';D.ch=0;D.charged=false;stopTone();} }
function shockableOK(){ const rh=curRhythm();
  return (S.rhythmForce==='vf')||rh.vf||(rh.wide&&rh.pulse); }
function defibShock(){
  const D=S.defib, rh=curRhythm();
  if(!D.charged){ toast(D.st==='charging'?'电容器充电中,请等充满再放电':'请先点「开始充电」'); return; }
  if(!shockableOK()){
    if(S.cheat.forceShock){} else { toast('⚠ '+rh.n+' 不是除颤适应症 — 未放电'); D.st='idle'; return; }
  }
  D.charged=false;
  stopTone(); playShock(D.e);
  D.st='fired';
  D.ch=0;
  const shockable=shockableOK();
  // 成功率:能量↑ 持续时间↓ CPR↑
  const vfDur=S.arrestAt<0?0:(S.t-S.arrestAt);
  const eF=clamp((D.e-70)/290,0,1);
  let p=(0.30+0.62*eF)*Math.exp(-vfDur/260)*(S.cpr.active?1.30:1.0);
  if(D.e<120) p*=0.50;
  if(D.sync&&!rh.vf) p*=1.25;
  if(S.cheat.forceShock) p=Math.max(p,S.cheat.alwaysROSC?1:0.85);   // 娱乐模式
  p=clamp(p,0.02,0.99);
  const ok=Math.random()<p;
  log('⚡ 除颤 '+D.e+'J → '+(ok?'转复成功':'未转复')+' (p='+p.toFixed(2)+')');
  if(ok){
    S.vfEnergy=1; S.vfAmp=1.35;
    if(S.dead){ S.dead=false; log('✓ 除颤后恢复自主循环 — 患者复苏'); }
    S.deathT=0; S.shockT=0;
    S.lactate=Math.min(S.lactate,5);   // 再灌注成功后代谢负担开始清除 S.cprPrev=undefined; S.cprPP=undefined;
    const r=Math.random();
    const dest=r<0.60?'sinus':(r<0.78?'sinusB':(r<0.93?'pea':'vf'));
    setRhythm(dest);
    S.pulsePresent=(dest==='sinus'||dest==='sinusB');
    if(!S.pulsePresent){ S.arrestAt=S.t; }
    S.stun=0.35; S.stunT=25;                       // 心肌顿抑
    beep(1000,.15,.08);
  } else {
    S.vfEnergy=clamp(S.vfEnergy*0.82,0,1);
    S.vfAmp=0.20+1.15*S.vfEnergy;
    S.stun=0.7; S.stunT=6;
    if(S.cheat.forceShock&&!shockable){        // 娱乐模式:即使"失败"也换个心律玩
      setRhythm(['af','svt','pvc','vt','sinusT'][irnd(0,4)]);
      S.pulsePresent=!RHY[S.rhythmForce].asys;
    }
  }
  setTimeout(()=>{D.st='idle';},1200);
  S.defibBurst=1.2;
}

function beep(f,d,g){ if(!S.sound||!AC) return; const o=AC.createOscillator(),v=AC.createGain();

  v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));
  o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime+(d||.08)+.02); }
function startTone(f,dur){ if(!S.sound||!AC)return; stopTone();
  toneO=AC.createOscillator(); toneG=AC.createGain(); toneO.type='sawtooth';
  toneO.frequency.setValueAtTime(f,AC.currentTime); toneG.gain.setValueAtTime(0,AC.currentTime);
  toneG.gain.linearRampToValueAtTime(.035,AC.currentTime+.1); toneO.connect(toneG); toneG.connect(AC.destination); toneO.start();
  toneTween={f,t:0,dur}; }
let toneTween=null;
function stopTone(){ if(toneO){ try{toneG.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.04); toneO.stop(AC.currentTime+.05);}catch(e){} toneO=null;toneG=null; } toneTween=null; }
function noise(dur,g,f0,f1){ if(!S.sound||!AC)return; const n=AC.createBufferSource();
  const len=AC.sampleRate*dur, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=b; const bp=AC.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=f0||1200;
  const v=AC.createGain(); v.gain.value=g||.1; n.connect(bp); bp.connect(v); v.connect(AC.destination); n.start(); }
function playShock(e){ if(!S.sound||!AC)return; const d=Math.min(.5,e/700);
  const o=AC.createOscillator(),v=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(110,AC.currentTime); o.frequency.exponentialRampToValueAtTime(28,AC.currentTime+d);
  v.gain.setValueAtTime(.5,AC.currentTime); v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+.02);
  noise(.14,.35,900); }
function qrsBeep(){ if(!S.qrsSound)return; const f=clamp(1500-S.hr*4,600,1700); beep(f,.045,.045); }

/* ---------- 报警 ---------- */
const ALARM_RULES=[
 {k:'brady', p:'--', t:'心动过缓', hp:1, test:()=>S.hr>0&&S.hr<S.alarm.hrLo},
 {k:'tachy', p:'--', t:'心动过速', hp:1, test:()=>S.hr>S.alarm.hrHi},
 {k:'vf',    p:'--', t:'心室颤动', hp:2, test:()=>curRhythm().vf},
 {k:'ag',    p:'--', t:'心室停搏', hp:2, test:()=>curRhythm().asys&&!curRhythm().org},
 {k:'pea',   p:'--', t:'无脉电活动', hp:2, test:()=>curRhythm().org},
 {k:'dead',  p:'--', t:'患者死亡 · 循环停止', hp:2, test:()=>S.dead},
 {k:'asyst', p:'--', t:'无脉性停搏', hp:2, test:()=>!S.pulsePresent&&S.map<25&&!curRhythm().org&&!curRhythm().vf},
 {k:'spo2',  p:'SpO₂', t:'血氧饱和度过低', hp:1, test:()=>S.spo2<S.alarm.spo2Lo},
 {k:'hypot', p:'NIBP', t:'低血压', hp:1, test:()=>S.map<S.alarm.mapLo},
 {k:'hyper', p:'NIBP', t:'高血压', hp:0, test:()=>S.sbp>S.alarm.sbpHi||S.dbp>S.alarm.dbpHi},
 {k:'bradyp',p:'RR',  t:'呼吸过缓', hp:1, test:()=>S.rrInt>0&&S.rrInt<S.alarm.rrLo},
 {k:'tachyp',p:'RR',  t:'呼吸过速', hp:0, test:()=>S.rrInt>S.alarm.rrHi},
 {k:'apnea', p:'RR',  t:'呼吸暂停', hp:2, test:()=>S.apnea&&!S.mechVent&&S.rrInt===0},
 {k:'loff',  p:'ECG', t:'导联脱落', hp:0, test:()=>Object.values(S.leadOff).some(Boolean)},
 {k:'perf',  p:'SpO₂',t:'低灌注指数', hp:1, test:()=>S.perfIdx<1},

function checkAlarms(){
  S.activeAlarms=[];
  for(const a of ALARM_RULES){ const on=a.test(); S.alarms[a.k]=on; if(on) S.activeAlarms.push(a); }
  S.activeAlarms.sort((x,y)=>y.hp-x.hp);
}

/* ============================================================
   10. 主物理循环
   ============================================================ */
function setRhythm(r){
  if(!RHY[r])return;
  const rh=RHY[r];
  const wasPulse=S.pulsePresent;
  const noPulse=!!(rh.vf||rh.asys);                 // 无有效灌注
  S.rhythmForce=r; S.rhythm=r; S.nextBeat=S.t+0.05;
  S.tmplEnd=undefined; S.actualRR=undefined; MOTION.length=0; BEATS.length=0;
  if(rh.vf){ S.vfEnergy=1; S.vfAmp=1.30; }
  // 残余血压期:由有脉转为无脉时,导管惯性仍能读到几秒微弱压力
  if(wasPulse&&noPulse&&S.pulseFade<=0) startArrestFade();
  if(noPulse){ if(S.pulsePresent){ S.arrestAt=S.t; } S.pulsePresent=false; log('⚠ '+rh.n+' — 无脉'); }
  else{
    S.pulsePresent=true;
    if(S.arrestAt>0){ S.arrestAt=-1; log('✓ 恢复自主循环 (ROSC)'); }
  }
  // 自然病程时间表:持续性室性心律会在若干分钟后自行恶化
  let nx,term=0;
  if(rh.wide&&rh.pulse){
    nx = (r==='vt')?rnd(160,420):(r==='vtn'?rnd(18,60):rnd(22,70));
    term = (r==='vt')?0.06:0;
  } else if(r==='svt'){ nx=rnd(60,420); term=0.75; }
  else if(rh.flutter){ nx=rnd(40,150); }
  else nx=Infinity;
  resetProg(nx,term);
  markDirty(); renderBuf(BSEC); renderDrawerSoon();
}
function setRhythmFree(){ S.rhythmForce=null; }
// 复苏:清除死亡/停搏计时器与所有残余状态
function revive(){
  S.dead=false; S.deathT=0; S.shockT=0;
  S.pulseFade=0; S.cprPrev=undefined; S.cprPP=undefined;
  S.stun=1; S.stunT=0; S.vfEnergy=1; S.vfAmp=1.35;
  S.pulsePresent=true; S.arrestAt=-1;
  setRhythm('sinus');
}

/* 恶性室性心律失常的实际发生率:QTc 越长越高(低钾/低镁/胺碘酮/低温) */
function ventRisk(){
  const rh=curRhythm();
  // 已经处于室性心律时不再掷骰子换心律 —— 只有非室性心律才计算「新发作」的风险
  if(rh.wide||rh.vf||rh.asys) return 0;
  let r=clamp(S.tdpRisk||0,0,1)*0.010;                       // 窦性心律下的室速发作率(QTc 驱动)
  if(S.elec.K<3.3) r+= (3.3-S.elec.K)*0.004;                  // 低钾 → 尖端扭转
  if(S.elec.K>6.0) r+=(S.elec.K-6.0)*0.055;                   // 高钾 → 室颤 / 停搏
  return clamp(r,0,0.5);
}
function scheduleNext(){
  const rh=curRhythm();
  if(rh.vf) return;
  if(rh.asys&&!rh.org){ S.nextBeat=Infinity; return; }
  let rr=60/Math.max(20,S.hr);
  if(rh.complete) rr=60/Math.max(28,S.hr>0?42:34);
  rr*=(1+N()*(rh.arr||0.02)*0.5);
  if(rh.fibA) rr*=rnd(.55,1.55);
  if(S.pvcPause>0){ rr*=1.8; S.pvcPause=0; }
  rr=clamp(rr,0.18,4.5);
  S.actualRR=rr;
  S.nextRR=rr;
  S.nextBeat=S.t+rr;
  // 提前建立这一拍的心搏描述符:心电图机必须收满 0.34 s 才能显示该拍,
  // 所以描述符要在 P 波出现之前就存在,否则 P 波会在画面上"迟到"冒出来
  S.pendingBeat=makeBeatDesc(S.nextBeat);
  BEATS.push({t:S.nextBeat,B:S.pendingBeat}); pruneBeats();
  if(rh.pvc&&Math.random()<rh.pvc) S.pvcPause=1;
  if(Math.random()<ventRisk()){          // QTc 驱动的恶性心律失常
    const pick=Math.random();
    if(S.elec.K>6.0&&pick<0.55){                    // 高钾:多发展为室颤/停搏
      setRhythm(pick<0.32?'ag':'vf');
      log('⚠ 高钾(K⁺ '+S.elec.K.toFixed(1)+')诱发室颤/停搏');
    }else{
      setRhythm(pick<0.45?'tdp':(pick<0.8?'vtn':'vt'));
      log('⚠ 恶性室性心律失常发作(QTc '+(S.qtc*1000).toFixed(0)+' ms)');
    }
  }
  if(rh.drop&&Math.random()>rh.conduct) S.blocked=1;
}

function beatFire(){
  const rh=curRhythm();
  if(rh.vf) return;
  const B=S.pendingBeat||makeBeatDesc();
  S.pendingBeat=null;
  if(rh.complete){ B.pAmp=0; B.pr=0; B.qrsWidth=(S.land.rbbb>0.5?1.78:1.44); }
  scheduleNext();                                     // 排下一拍并提前建好它的描述符
  if(B.pOnly){ S.blocked=1; return; }
  S.art.lastBeatT=B.t; S.rPeak=B.t;
  if(S.pulsePresent){
    qrsBeep();
    if(S.qrsHist.length>40) S.qrsHist.shift();
    S.qrsHist.push(S.t);
  }
  if(S.prevBeatT>0&&B.t>S.prevBeatT){ S.lastRR=B.t-S.prevBeatT; if(S.lastRR<3) S.rrHist.push(S.lastRR); }
  S.prevBeatT=B.t; S.beatCount++;
  if(S.pulsePresent&&S.lastRR>0.25) S.vrate=S.vrate?lerp(S.vrate,60/S.lastRR,0.25):60/S.lastRR;
}
// 心搏触发时 R 峰可能比当前时刻早不到一个采样,把已写过的过去样本按新心搏补算
function backfill(t0){
  let ai0=Math.max(0,Math.floor(t0*FS)), ai1=gIdx;
  if(ai1-ai0<=0||ai1-ai0>BUFSZ) return;
  for(let L2=0;L2<12;L2++){ const b=ecgBuf[L2];
    for(let ai=ai0;ai<=ai1;ai++) b[gmod(ai)]=evalLead(ai/FS,L2); }
}
function pruneBeats(){ while(MOTION.length&&MOTION[0].t<S.t-BSEC-1) MOTION.shift();
  const cut=S.t-BSEC-0.6; let i=0; while(i<BEATS.length&&BEATS[i].t<cut) i++; if(i) BEATS.splice(0,i); }

// 室颤幅度随心肌能量耗竭:粗颤 → 细颤 → 趋于停搏
/* 室扑:约 4~5 Hz 的连续正弦(300 bpm),振幅沿基线轻微摆动,轴随极缓慢旋转 */
function vflSample(t,L2){
  const f=4.6+0.35*Math.sin(t*1.7);
  const ph=TAU*f*t;
  const axis=Math.sin(t*0.42)*42;                 // 轴缓慢摆动 ±42°
  const ld=LEADS[L2];
  let v=Math.sin(ph)*0.92+Math.sin(ph*2+1.1)*0.16;
  v+=hashNoise(Math.floor(t*FS),L2+31)*0.09;        // 细碎噪声
  v*=0.86+0.14*Math.sin(t*0.9);                    // 振幅包络
  return v*3.4*S.vfAmp*projLead(ventComp(1, 128+axis*0.4, 62+axis),ld);
}
function vfSample(t,L2){
  const ph=L2*0.83;
  let v=(Math.sin(t*46.3+ph)*.48+Math.sin(t*29.1+ph*1.7)*.34+Math.sin(t*71.7+ph*.3)*.2+Math.sin(t*13.9+ph)*.3);
  v+=Math.sin(t*3.1+L2)*0.10;
  return (v+hashNoise(Math.floor(t*FS),L2+7)*0.62)*S.vfAmp*(L2<3?1.25:1);
}
function flatSample(t,L2){    // 心室停搏:仅剩基线与极小噪声
  return Math.sin(t*0.7+L2)*0.012+hashNoise(Math.floor(t*FS),L2+31)*0.025;
}

/* ═══════════════════════════════════════════════════════════
   自然病程引擎 —— 让「时间」本身成为病理驱动力
   · 持续性室性心律 → 有效泵血衰竭 → 血压崩塌 → 恶化为更致命的心律
   · 室颤 → 能量耗竭 → 粗颤变细颤 → 心室停搏
   · 休克:交感代偿维持血压 → 储备耗竭 → 断崖式失代偿
   · 无脉瞬间的残余血压期(导管惯性)
   ═══════════════════════════════════════════════════════════ */
function startArrestFade(){
  if(!S.pulsePresent||S.pulseFade>0) return;
  S.pulseFade=rnd(3.5,7.5); S.fadeT0=S.pulseFade;
  S.fadeMAP=S.map; S.fadePP=S.pp; S.fadeHR=S.vrate||S.hr||70;
  log('⚠ 无脉 — 残余血压期 '+S.pulseFade.toFixed(1)+' s');
}
function progression(dt){
  const rh=curRhythm();
  const sd=dt*(S.prog.speed===undefined?1:S.prog.speed);   // 病程推进速度
  /* 长时间深度休克 → 循环停止。必须放在所有心律分支之前,
     否则 VF / 停搏分支的提前 return 会把它挡掉 */
  if(S.dead) return;
  if(S.prog.on&&S.map<9&&S.gcs<=3&&S.pulseFade<=0) S.deathT+=sd; else S.deathT=Math.max(0,S.deathT-sd*2);
  if(S.deathT>90){
    S.dead=true; S.pulsePresent=false; S.pulseFade=0;
    // 只把「有脉」心律转成停搏。室颤/室扑/无脉电活动保持原样,
    // 它们有自己的能量耗竭通路,直接变 ag 会变成不可除颤的死局
    if(!rh.asys&&!rh.vf&&!rh.flutterV&&!rh.org) setRhythm('ag');
    log('✝ 循环停止 — 患者死亡(不可逆休克)'); renderDrawerSoon();
    return;
  }
  // 意识状态:脑灌注取决于 MAP 与混合静脉氧(任何心律下都要更新)
  S.gcs = (S.pulsePresent&&S.map>55&&S.svo2>45) ? 15
         : (S.map>42&&S.svo2>32) ? 10+Math.floor(clamp((S.map-42)/13,0,1)*3)
         : (S.map>28) ? 6+Math.floor(clamp((S.svo2-20)/12,0,1)*3) : 3;
  if(!S.prog.on){ S.prog.t=0; S.prog.comp=1; return; }
  /* ── ① 室颤:心肌能量耗竭。粗颤 → 细颤 → 停搏 */
  if(rh.vf){
    S.prog.t+=sd;
    S.vfEnergy=clamp(S.vfEnergy*Math.exp(-dt/(S.cpr.active?300:150)*S.prog.speed),0,1);
    S.vfAmp=0.20+1.15*S.vfEnergy;
    if(S.vfEnergy<0.05&&S.prog.t>20)
      setRhythm('ag'), log('室颤能量耗竭 → 心室停搏 · 停搏 '+(S.arrestAt<0?0:(S.t-S.arrestAt).toFixed(0))+' s');
    return;
  }
  /* ── ①b 室扑:短暂维持后必然转为室颤(无脉 → 停搏) */
  if(rh.flutterV){
    S.prog.t+=sd;
    S.vfAmp=1.05;                       // 室扑是组织化的快速激动,振幅接近 VT 而非 VF
    if(S.t>S.prog.next){
      S.vfEnergy=Math.max(S.vfEnergy,0.34);
      setRhythm('vf'); startArrestFade();
      log('心室扑动 → 心室颤动 · 停搏 '+(S.arrestAt<0?0:(S.t-S.arrestAt).toFixed(0))+' s');
    }
    return;
  }
  /* ── ② 无脉电活动持续不退 → 停搏 */
  if(rh.asys){
    if(rh.org){ S.prog.t+=sd;
      if(S.prog.t>50&&Math.random()<dt*0.05) setRhythm('ag'), log('无脉电活动持续 → 心室停搏'); }
    return;
  }
  /* ── ③ 有脉的室性心律:有效泵血随时间衰竭 */
  if(rh.wide&&rh.pulse){
    S.prog.t+=sd;
    S.prog.vtEff=clamp(S.prog.vtEff-dt*0.0027*S.prog.speed,0.07,0.85);   // 持续下滑,不回弹
    // 血压越低恶化越快:重度低灌注会把下一次恶化提前
    if(fxVal('amio')>0.05&&Math.random()<0.02*clamp(fxVal('amio'),0,1)){
      setRhythm('sinus'); log('胺碘酮使持续性室速终止'); return; }
    const due=S.t > (S.prog.next - Math.max(0,38-S.map)*2.5);
    if(due){
      if(Math.random()<S.prog.selfTerm){ setRhythm('sinus'); log('室速自行终止'); return; }
      const keep=Math.min(S.prog.vtEff,0.30);        // 恶化后不会重新恢复灌注
      const rx=1+2.5*clamp(fxVal('amio'),0,1)+1.4*clamp(fxVal('lido'),0,1);
      /* 自然病程:单形性/多形性 VT → 尖端扭转 VT → 室扑 → 室颤 → 停搏
         (室性心律越来越「不像心电图」,最终失去可辨认的组织化激动) */
      const nxt=(rh===RHY.vt)?(Math.random()<0.42?'tdp':'vtn')
                :(rh===RHY.vtn)?(Math.random()<0.5?'tdp':'vfl')
                :(rh===RHY.tdp)?'vfl'
                :'vfl';
      const wait=((nxt==='tdp')?rnd(16,46):(nxt==='vfl'?rnd(10,26):rnd(20,54)))*rx;
      if(nxt==='vfl'){
        // 室扑通常先失去机械效应 → 转 VF 时走无脉衰减路径
        S.prog.vtEff=Math.min(S.prog.vtEff,0.12); setRhythm('vfl'); S.prog.next=S.t+wait;
        startArrestFade();
        log('持续性 '+rh.n+' → 心室扑动(失去组织化激动)');
      }else{
        setRhythm(nxt); S.prog.vtEff=keep; S.prog.next=S.t+wait;
        log('持续性 '+rh.n+' → '+RHY[nxt].n+'(自然病程)');
      }
    }
    return;
  }
  /* ── ④ 其他心律的自然转归 */
  if(rh.flutter){
    S.prog.t+=sd; if(S.t>S.prog.next){ setRhythm(Math.random()<0.7?'af':'sinus'); log('心房扑动自然转归'); }
    return;
  }
  if(rh.retro){
    S.prog.t+=sd;
    if(S.t>S.prog.next&&Math.random()<S.prog.selfTerm){ setRhythm('sinus'); log('室上速自行终止'); }
    return;
  }
  if(S.prog.t>0){ S.prog.t=0; S.prog.vtEff=0.85; S.prog.next=Infinity; S.prog.vtHeld=0; }
  /* ── ④b 深度休克下有脉室速必然失去有效输出 */
  if(rh.wide&&rh.pulse&&S.map<16) S.shockT+=sd; else S.shockT=Math.max(0,S.shockT-sd*2);
  if(S.shockT>45){
    setRhythm('vf'); log('深度休克,室性心律失去有效输出 → 心室颤动');
    return;
  }

  /* ── ⑤ 交感代偿储备:血压越低,代偿被调用越狠,储备被消耗越快 */
  if(S.pulsePresent){
    if(S.map<66) S.prog.compT+=dt*clamp((66-S.map)/26,0.25,2.2)*S.prog.speed;
    else         S.prog.compT=Math.max(0,S.prog.compT-dt*0.10);
    S.prog.comp=clamp(1-S.prog.compT/300,0.12,1);
  } else S.prog.comp=0.12;
}
/* 低灌注时脉搏血氧探头测不准 */
function spo2Display(){
  if(S.dead) return {v:0, ok:false, dead:true};
  const pi=S.perfIdx||0;
  // 残余血压期仍有脉搏,只要灌注指数够高就还能读到数
  if(pi<0.55) return {v:null, ok:false, weak:true};          // 探头锁不上信号
  if(!S.pulsePresent&&S.pulseFade<=0) return {v:null, ok:false, weak:true};
  if(pi<1.0)  return {v:Math.round(clamp(S.sao2-rnd(1,5),70,100)), ok:true, wob:true};
  return {v:Math.round(S.spo2Lock||S.sao2), ok:true};
}
/* 动脉血气:把连续变量折算成一张试纸读数(加预分析误差) */
function drawABG(){
  const hco3=clamp(24-(S.lactate>1?(S.lactate-1)*1.6:0),6,30);
  S.abg={
    ph:+(S.ph+rnd(-0.012,0.012)).toFixed(2),
    pco2:Math.round(clamp(S.paco2+rnd(-1.6,1.6),12,150)),
    po2:Math.round(clamp(S.pao2+rnd(-2.5,2.5),20,120)),
    hco3:Math.round(hco3+rnd(-0.6,0.6)),
    be:Math.round((hco3-24.4)+rnd(-0.8,0.8)),
    lac:+(S.lactate+rnd(-0.06,0.06)).toFixed(1),
    sao2:Math.round(clamp(S.sao2+rnd(-0.4,0.4),50,100)),
    hb:S.hb, hct:Math.round(S.hb/3.3),   // Hct ≈ Hb(g/L)/3.3
  };
  return S.abg;
}
// 镇静深度 RASS(propofol 等按各自效应折算)
function sedationRass(){
  return Math.round(clamp(-1.5*clamp(fxVal('hrAdd'),-3,0)*0.4
                          -2.2*clamp(fxVal('svr'),-6,0)*0.25
                          -3.0*(fxVal('pct')||0), -5, 4));
}
function resetProg(next,term){
  S.prog.t=0; S.prog.vtEff=0.85;
  // comp / compT 不在这里重置 —— 交感代偿储备是全身状态,换心律不清零
  S.prog.next=(next===undefined)?Infinity:S.t+next;
  S.prog.selfTerm=term||0;
}

function physStep(dt){
  S.t+=dt; gIdx++;
  if(S.stunT>0){ S.stunT-=dt; S.stun=lerp(S.stun,1,dt*0.35); } else S.stun=1;
  // 体动事件:默认每 ~20 s 一次且只影响事件本身那段;CPR 每次按压算一次事件
  const mAmt=(S.motionAmt===undefined?0.15:S.motionAmt);
  S.motion=motionAt(S.t);
  // 低温自动出现寒战肌电
  const chr=clamp((36.4-S.temp)/1.8,0,1);
  if(chr>S.tremor) S.tremor=chr;
  if(mAmt>0&&Math.random()<dt*0.05*mAmt) triggerMotion(rnd(0.5,1.5));   // 默认约每 67 s 一次
  if(S.cpr.active&&Math.random()<dt*(S.cpr.rate/60)*0.9) triggerMotion(rnd(0.5,0.9),rnd(0.25,0.5));
  S.rrInt=clamp(S.base.rr+fxVal('rrAdd'),0,50);
  S.apnea=(S.rrInt<=0&&!S.mechVent);
  progression(dt);
  hemodynamics(dt);
  gasExchange(dt);
  // 心律触发
  if(!curRhythm().vf&&S.nextBeat<=S.t) beatFire();
  // CPR 胸壁按压伪差:属于"生理性运动",写进缓冲(通道无关地对所有导联同相叠加)
  let cpr=0;
  if(S.cpr.active){
    const ph=(S.t*(S.cpr.rate/60))%1;
    cpr=Math.exp(-Math.pow((ph-0.5)/0.16,2))*0.95;
    if(ph<0.5&&S.t-S.cpr.lastT>60/S.cpr.rate*0.45){ S.cpr.lastT=S.t; if(Math.random()<.25) noise(.05,.05,600); }
  }
  // 心电:只写纯净形态(噪声与伪差在渲染时叠加,绝不写进缓冲区)
  const asys=curRhythm().asys&&!curRhythm().org;
  for(let L2=0;L2<12;L2++){
    let v=asys?flatSample(S.t,L2):evalLead(S.t,L2);
    if(cpr>0) v+=cpr*Math.cos(L2*0.4);
    ecgBuf[L2][gmod(gIdx)]=v;
  }
  waveforms(dt);
  nibpStep(dt);
  const D=S.defib;
  if(D.st==='charging'){ D.ch=clamp(D.ch+dt/(0.5+D.e*0.007),0,1);
    if(toneO) toneO.frequency.value=140+(D.e/360)*420+D.ch*90;
    if(D.ch>=1){ D.ch=1; D.st='ready'; D.charged=true; beep(1800,.1,.07); } }
  if(D.st==='ready'&&!S.cheat.infEnergy) D.ch=Math.max(0,D.ch-dt*0.010);
  if(D.st==='ready'&&S.defibBurst>0){ S.defibBurst-=dt; if(S.defibBurst<=0) D.st='idle'; }
  /* 心率变异性:正常窦性心律才有意义 */
  if(S.rrHist.length>12){
    const a=S.rrHist.slice(-40), m=a.reduce((x,y)=>x+y,0)/a.length;
    let sd=0,ms=0;
    for(let i=0;i<a.length;i++){ sd+=(a[i]-m)*(a[i]-m);
      if(i){ const d=a[i]-a[i-1]; ms+=d*d; } }
    S.hrv.sdnn=Math.sqrt(sd/(a.length-1))*1000;
    S.hrv.rmssd=Math.sqrt(ms/(a.length-1))*1000;
    S.hrv.rr=+(m*1000).toFixed(0);
  }else{ S.hrv.sdnn*=0.98; S.hrv.rmssd*=0.98; S.hrv.rr=Math.round(60/Math.max(20,S.hr)*1000); }
  /* QTc 越长,尖端扭转型室速风险越高(低钾/低镁/胺碘酮都会推高) */
  const rrq=60/Math.max(25,S.hr||70);
  S.qtc=(S.qtInt/Math.sqrt(rrq));
  S.tdpRisk=clamp((S.qtc-0.42)*2.6
                + (3.6-S.elec.K)*0.30 + (1.6-S.elec.Mg)*0.26
                + fxVal('amio')*0.45, 0, 1);
  S.perfIdx=clamp((S.pp-6)/40*(S.spo2/100)*3,0,4);
  pruneDrugs();
  S._acc=(S._acc||0)+dt;
  if(S._acc>0.25){ S._acc=0; checkAlarms(); }
}

/* ============================================================
   11. 渲染
   ============================================================ */
const SCREEN_MM=88;
const CH={
 PLTH:{n:'PLTH',l:'脉搏波',c:'#39d7f2',min:0,max:1.6},
 ART :{n:'ART', l:'动脉压',c:'#ff5b5b',unit:'mmHg'},
 RESP:{n:'RESP',l:'呼吸',  c:'#ffd23f',min:-1.6,max:1.6},
 CO2 :{n:'CO2', l:'EtCO₂', c:'#b98cff',unit:'mmHg'},
};
function leadOffFor(L2){
  const n=LEADS[L2].n, o=S.leadOff;
  if(n==='V1'&&o.V1)return 1; if(n==='V2'&&o.V2)return 1; if(n==='V3'&&o.V3)return 1;
  if(n==='V4'&&o.V4)return 1; if(n==='V5'&&o.V5)return 1; if(n==='V6'&&o.V6)return 1;
  const limb = (n==='I'||n==='II'||n==='III'||n==='aVR'||n==='aVL'||n==='aVF');
  if(limb){
    if(o.RA&&(n==='I'||n==='II'||n==='aVR')) return o.LA?2:1;
    if(o.LA&&(n==='I'||n==='III'||n==='aVL')) return 2;
    if(o.LL&&(n==='II'||n==='III'||n==='aVF')) return 1;
    if(o.RL) return 2;
  }
  return 0;
}
/* ---- 以下函数只在「画」的时候调用,不参与任何缓冲区写入 ---- */
function drawWander(i,L2){                       // 基线漂移 0.2~1.3 Hz
  const w=S.wave.wander, t=i/FS;
  return w*0.075*Math.sin(t*0.62+L2*0.3)+w*0.030*Math.sin(t*1.31+L2);
}
function drawNoise(i,L2){                        // 肌电 + 白噪声
  const e=S.wave.noise*(1+ (S.tremor||0)*2.2);
  let n=e*0.016*hashNoise(i,L2*13+1);
  n+=e*0.011*hashNoise(i>>1,L2+101);             // 稍低频成分
  n+=e*0.009*hashNoise(i>>3,L2+211);
  const m=S.mains||0;                            // 50 Hz 工频干扰
  if(m>0) n+=m*0.045*Math.sin(TAU*50*(i/FS)+L2)+m*0.018*Math.sin(TAU*150*(i/FS));
  return n;
}
/* 体动伪差是「瞬态事件」,不是全局包络:
   每次动作只在它发生的那一小段时间里造成抖动,其余时间完全不受影响。
   事件表按时间查包络 → 完全确定性,而且不会牵动整条波形。 */
const MOTION=[];
function triggerMotion(amp,dur){ MOTION.push({t:S.t,amp:amp,dur:dur||rnd(0.45,1.6)});
  if(MOTION.length>48) MOTION.shift(); }
function motionAt(t){
  let m=0;
  for(let i=0;i<MOTION.length;i++){ const e=MOTION[i], d=t-e.t;
    if(d<0||d>e.dur) continue;
    m+=e.amp*Math.sin(Math.PI*(d/e.dur))**2;      // 两端平滑归零
  }
  return m;
}
function drawMotion(i,L2){                         // 体动伪差(局部瞬态)
  const t=i/FS;
  const m=motionAt(t);
  if(m<0.015) return 0;
  const g=0.55*(S.motionAmt===undefined?0.30:S.motionAmt);
  return m*g*(0.52*Math.sin(t*11.3+L2*0.6)
            + 0.28*Math.sin(t*2.1+L2*0.2)
            + 0.20*Math.sin(t*23.7+L2*1.3));
}
function drawLeadOff(i,L2){                      // 导联脱落
  const o=leadOffFor(L2); if(!o) return 0;
  const t=i/FS;
  if(o===1) return Math.sin(t*TAU*0.3)*2.2+hashNoise(i,L2)*0.35+(L2===3?8*Math.sin(t*1.7):0);
  if(o===2) return hashNoise(i,L2+3)*0.7+((t%1)<0.10?2.0:0);
  return hashNoise(i,L2+5)*0.9+Math.sin(t*37)*0.3;
}
function chColor(k){
  if(S.view.traceColor==='green')return '#39ff88';
  if(S.view.traceColor==='white')return '#e8f0f6';
  if(S.view.traceColor==='yellow')return '#ffd23f';
  if(k in CH)return CH[k].c;
  return LEADS[LI[k]].c;
}
function buildRows(){
  const wrap=document.getElementById('waveWrap');
  wrap.innerHTML='';
  const keys=S.view.leads;
  keys.filter(k=>(k!=='ART')||S.artLine).forEach(k=>{
    const d=document.createElement('div'); d.className='row';
    d.style.height=S.view.rows+'px';
    const lab=k in CH?CH[k].l:k;
    d.innerHTML='<canvas></canvas><div class="lb" style="color:'+chColor(k)+'">'+lab+'</div>'+
      '<div class="rt"></div>'+
      (S.view.cal&&k in CH?'':'<div class="cal" style="color:'+chColor(k)+'"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 11 L1 2 L5 2 L5 11 L9 11 L9 2 L13 2 L13 11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>');
    wrap.appendChild(d);
    d.dataset.ch=k;
    fitCanvas(d.querySelector('canvas'));
  });
}
function fitCanvas(c){
  const r=c.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=Math.max(1,Math.round(r.width*dpr)); c.height=Math.max(1,Math.round(r.height*dpr));
}
/* ═══════════════════════════════════════════════════════════
   监护仪扫描显示(raster sweep),不是滚动
   画布右侧保留上一帧内容 → 只在扫描头前方擦除并推进,
   扫描头到达右端后整体清屏、回到左端继续从左往右画。
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   监护仪扫描显示(raster sweep)
   语义:扫描头从左端出发向右推进,头左边是已画出的波形,右边尚未扫描。
   实现:整屏每帧重画(按扫描映射)—— 不用增量 clearRect。
         因为辉光(shadowBlur)总是落在扫描头右侧,增量擦除会把
         上一帧的辉光反复抹掉,波形就变成又细又暗的断续点。
   ═══════════════════════════════════════════════════════════ */
let SWEEP={p:0,t0:0,init:false,win:3.5};
function sweepAdvance(dtR){
  const winSec=SCREEN_MM/S.view.speed/(S.view.scanSpeed||1);
  const lag=0.15;                       // 扫描头略微落后当前时刻,保证有数据
  if(!SWEEP.init){ SWEEP.t0=S.t-lag; SWEEP.init=true; }
  // 扫描头时刻 = 现在 − lag;位置由它在本轮时间窗中的比例决定
  let p=(S.t-lag-SWEEP.t0)/winSec;
  if(p>=1){ const n=Math.floor(p); SWEEP.t0+=n*winSec; p-=n; }   // 到右端 → 跳回左边
  if(p<0){ SWEEP.t0=S.t-lag; p=0; }
  SWEEP.p=p; SWEEP.win=winSec;
  return p;
}
function drawRow(d){
  const k=d.dataset.ch, c=d.querySelector('canvas'), ctx=c.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=c.width/dpr, H=c.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const isECG=(k in CH)===false;
  const L2=isECG?LI[k]:-1;
  const buf = isECG?ecgBuf[L2]:(k==='PLTH'?bufPleth:k==='ART'?bufArt:k==='RESP'?bufResp:bufCO2);
  const color=chColor(k);

  const winSec=SCREEN_MM/S.view.speed/(S.view.scanSpeed||1);
  const p=SWEEP.p, xH=p*W;                 // 扫描头位置
  const tOld=SWEEP.t0, tHead=SWEEP.t0+p*winSec;   // 屏左=本轮起点(固定),头=当前扫描位置

  // ---- 量程(每次按当前状态重算) ----
  const isBP=(k==='ART'), isCO2=(k==='CO2'), isPl=(k==='PLTH'), isRp=(k==='RESP');
  let pv=1,capV=0,minV=0,base=H*0.54;
  if(isBP){ pv=Math.max(40,Math.ceil((Math.max(S.sbp,S.pp*1.6)+30)/40)*40); }
  else if(isCO2){ pv=Math.max(30,Math.ceil(((S.etco2||40)+12)/20)*20); }
  else if(isPl){ pv=1.5; minV=0; }
  else if(isRp){ pv=2.0; minV=-1.0; }
  else { const pxPerMm=W/SCREEN_MM; capV=Math.min(S.view.gain*pxPerMm,H*0.42); S.effGain=capV/pxPerMm; }
  const yOf=(v)=>{
    if(isECG) return base-v*capV;
    if(isBP||isCO2) return H*0.95-(v/pv)*(H*0.86);
    if(isPl) return H*0.95-((v-minV)/pv)*(H*0.86);
    return H*0.50-((v-minV)/pv)*(H*0.86);
  };
  // 伪差只在绘制时叠加,缓冲区里是干净形态
  const artAt=(i)=>{
    if(isECG) return drawWander(i,L2)+drawNoise(i,L2)+drawMotion(i,L2)+drawLeadOff(i,L2);
    if(isBP){ const mo=motionAt(i/FS); return 0.35*hashNoise(i,7)+(mo>0.15?mo*4.0*Math.sin(i/FS*6.2):0); }
    if(isPl){ const mo=motionAt(i/FS); return (0.012+mo*0.30)*hashNoise(i>>1,17)+mo*0.22*Math.sin(i/FS*7.7); }
    if(isRp) return 0.020*hashNoise(i,23);
    return 0.22*hashNoise(i,29);
  };

  // ---- 整屏重画 ----
  ctx.clearRect(0,0,W,H);
  if(xH>0.5){
    const N=Math.max(8,Math.round(xH*2.2));   // 每像素约 2.2 个采样,足够细
    ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.shadowBlur=4; ctx.shadowColor=color;
    ctx.beginPath();
    for(let j=0;j<=N;j++){
      const t=tOld+(tHead-tOld)*(j/N);
      const i=Math.round(t*FS);
      let v=buf[((i%BUFSZ)+BUFSZ)%BUFSZ];
      v+=artAt(i);
      const x=(j/N)*xH;
      const y=yOf(v);
      if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.shadowBlur=0;
  }
  const nsg=(isECG?'E'+S.view.gain:'C'+k)+'@'+S.view.speed+'@'+S.view.scanSpeed;
  if(nsg!==d._sig){ SWEEP.init=false; }        // 参数变了 → 重新起一轮扫描
  d._sig=nsg;
  d._pPrev=p;
  const rt=d.querySelector('.rt');
  if(rt) rt.textContent = isECG?((S.effGain||S.view.gain).toFixed(1)+' mm/mV')
                     : (k==='ART'?Math.round(S.sbp)+'/'+Math.round(S.dbp):'');
}
function drawAll(){
  document.querySelectorAll('#waveWrap .row').forEach(d=>{ if(d.offsetParent) drawRow(d); });
  drawTiles(); drawAlarmBar();
}

function buildTiles(){

let L12MODE={mm:4,compact:false};
function draw12(){
  const cv=document.getElementById('c12');
  const maxW=Math.min(1400,Math.max(760,document.querySelector('.pg12 .pb').clientWidth-16));
  const PX=L12MODE.compact?maxW/262:4;
  const colSec=2.5*S.view.speed/25;

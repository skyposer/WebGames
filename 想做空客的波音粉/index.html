<!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>手机编程代码展示</title>    <style>        /* 页面基础设置 */        body {            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;            background-color: #f4f4f5;            margin: 0;            padding: 0;            height: 100vh;            display: flex;            justify-content: center;            align-items: center;        }        /* 1. 按钮样式 - 固定在左上角 */        #codeBtn {            position: absolute; /* 绝对定位 */            top: 20px;          /* 距离顶部 20px */            left: 20px;         /* 距离左侧 20px */            padding: 10px 15px;            font-size: 14px;            background-color: #007AFF; /* 科技蓝 */            color: white;            border: none;            border-radius: 6px;            box-shadow: 0 2px 5px rgba(0,0,0,0.2);            cursor: pointer;            z-index: 100; /* 保证层级在最上 */        }        #codeBtn:active {            background-color: #0056b3;        }        /* 2. 底部署名文字 */        .footer-text {            position: absolute;            bottom: 30px;            width: 100%;            text-align: center;            color: #888;            font-size: 14px;            font-weight: bold;            letter-spacing: 1px;        }        /* 3. 弹窗遮罩层 */        .modal-overlay {            display: none; /* 默认隐藏 */            position: fixed;            top: 0;            left: 0;            width: 100%;            height: 100%;            background-color: rgba(0, 0, 0, 0.6); /* 深色背景 */            z-index: 1000;            justify-content: center;            align-items: center;            padding: 20px;            box-sizing: border-box;        }        /* 4. 弹窗内容框 */        .modal-content {            background-color: #1e1e1e; /* 代码编辑器深色背景 */            padding: 20px;            border-radius: 10px;            width: 100%;            max-width: 500px;            position: relative;            box-shadow: 0 4px 15px rgba(0,0,0,0.5);            border: 1px solid #333;        }        /* 代码文本样式 */        .code-block {            font-family: 'Courier New', Courier, monospace; /* 等宽字体 */            color: #d4d4d4;            font-size: 14px;            line-height: 1.5;            white-space: pre-wrap; /* 自动换行 */            word-break: break-all;        }        /* 简单的语法高亮模拟 */        .keyword { color: #569cd6; } /* import, try */        .string { color: #ce9178; }  /* "..." */        .comment { color: #6a9955; } /* # ... */        .function { color: #dcdcaa; } /* os.system */        /* 关闭按钮 */        .close-btn {            position: absolute;            top: 10px;            right: 15px;            color: #aaa;            font-size: 24px;            cursor: pointer;        }        .close-btn:hover { color: #fff; }    </style></head><body>    <!-- 左上角的按钮 -->    <button id="codeBtn">查看我编程的代码</button>    <!-- 底部文字 -->    <div class="footer-text">由想坐空客的波音</div>    <!-- 弹窗结构 -->    <div id="codeModal" class="modal-overlay">        <div class="modal-content">            <span class="close-btn">&times;</span>            <!-- 代码内容区域 -->            <div class="code-block"><span class="keyword">import</span> os<span class="comment"># 尝试调用安卓系统的命令来打开抖音粉制作</span><span class="comment"># com.ss.android.ugc.aweme 是抖音的包名</span>os.<span class="function">system</span>(<span class="string">"am start -n com.ss.android.ugc.aweme/.main.MainActivity"</span>)</div>        </div>    </div>    <script>        // 获取元素        const modal = document.getElementById('codeModal');        const btn = document.getElementById('codeBtn');        const closeBtn = document.querySelector('.close-btn');        // 点击按钮打开弹窗        btn.onclick = function() {            modal.style.display = 'flex';        }        // 点击关闭按钮关闭弹窗        closeBtn.onclick = function() {            modal.style.display = 'none';        }        // 点击弹窗外部区域关闭弹窗        window.onclick = function(event) {            if (event.target == modal) {                modal.style.display = 'none';            }        }    </script></body></html><!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>横向按钮组</title>    <style>        body {            font-family: sans-serif;            background-color: #f4f4f5;            margin: 0;            padding: 20px;        }        /* 按钮容器：控制横向排列 */        .btn-container {            display: flex;          /* 关键：启用 Flex 布局 */            gap: 10px;              /* 关键：按钮之间的间距 */            flex-wrap: wrap;        /* 如果屏幕太小，允许换行 */        }        .my-btn {            padding: 10px 15px;            font-size: 14px;            background-color: #007AFF;            color: white;            border: none;            border-radius: 6px;            cursor: pointer;        }    </style></head><body>    <!-- 用一个 div 把所有按钮包起来 -->    <div class="btn-container">        <button class="my-btn">手机系统文字版一代</button>        <button class="my-btn">其他</button>        <button class="my-btn">别看了，什么都没有</button>    </div>    <div class="footer-text" style="margin-top: 20px; color: #888;"></div></body></html><!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>三个按钮的弹窗示例</title>    <style>        /* 基础页面样式 */        body {            font-family: 'Arial', sans-serif;            text-align: center;            padding: 50px;            background-color: #f4f4f4;        }        /* 按钮通用样式 */        .trigger-btn {            padding: 10px 20px;            margin: 10px;            font-size: 16px;            cursor: pointer;            border: none;            border-radius: 5px;            color: white;            transition: background 0.3s;        }        .btn-1 { background-color: #3498db; }        .btn-2 { background-color: #2ecc71; }        .btn-3 { background-color: #e74c3c; }        .trigger-btn:hover { opacity: 0.8; }        /* --- 弹窗核心样式 --- */                /* 1. 遮罩层 (背景) */        .modal-overlay {            display: none; /* 默认隐藏 */            position: fixed;            top: 0;            left: 0;            width: 100%;            height: 100%;            background-color: rgba(0, 0, 0, 0.5); /* 半透明黑色 */            z-index: 1000;            justify-content: center;            align-items: center;        }        /* 2. 弹窗内容框 */        .modal-content {            background-color: white;            padding: 30px;            border-radius: 8px;            width: 300px;            text-align: center;            box-shadow: 0 4px 15px rgba(0,0,0,0.3);            position: relative;            animation: fadeIn 0.3s; /* 简单的淡入动画 */        }        /* 3. 关闭按钮 (X) */        .close-btn {            position: absolute;            top: 10px;            right: 15px;            font-size: 24px;            cursor: pointer;            color: #aaa;        }        .close-btn:hover { color: #000; }        /* 动画定义 */        @keyframes fadeIn {            from { opacity: 0; transform: translateY(-20px); }            to { opacity: 1; transform: translateY(0); }        }    </style></head><body>    <!-- 1. 页面主体：三个触发按钮 -->    <h2>请点击下方的按钮</h2>    <button class="trigger-btn btn-1" onclick="openModal('modal1')">按钮一 (通知)</button>    <button class="trigger-btn btn-2" onclick="openModal('modal2')">按钮二 (成功)</button>    <button class="trigger-btn btn-3" onclick="openModal('modal3')">按钮三 (警告)</button>    <!-- 2. 弹窗结构 1 -->    <div id="modal1" class="modal-overlay">        <div class="modal-content">            <span class="close-btn" onclick="closeModal('modal1')">&times;</span>            <h3>🔔 系统通知</h3>            <p>这是按钮一对应的弹窗内容。</p>        </div>    </div>    <!-- 3. 弹窗结构 2 -->    <div id="modal2" class="modal-overlay">        <div class="modal-content">            <span class="close-btn" onclick="closeModal('modal2')">&times;</span>            <h3>✅ 操作成功</h3>            <p>这是按钮二对应的弹窗内容。</p>        </div>    </div>    <!-- 4. 弹窗结构 3 -->    <div id="modal3" class="modal-overlay">        <div class="modal-content">            <span class="close-btn" onclick="closeModal('modal3')">&times;</span>            <h3>开发商</h3>            <p>感谢爱酷的大力支持</p>        </div>    </div>    <!-- 5. JavaScript 逻辑 -->    <script>        // 打开弹窗的函数        function openModal(modalId) {            document.getElementById(modalId).style.display = 'flex';        }        // 关闭弹窗的函数        function closeModal(modalId) {            document.getElementById(modalId).style.display = 'none';        }        // 点击遮罩层（弹窗外部）也可以关闭        window.onclick = function(event) {            if (event.target.classList.contains('modal-overlay')) {                event.target.style.display = 'none';            }        }    </script></body></html>
